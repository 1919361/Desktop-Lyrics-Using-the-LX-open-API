                resetLineChars(activeIndex);

                // 保险：把所有「不该展开」的等待点行合拢
                // （跳转、换歌重取歌词之后都不会留下半开/卡住的等待点）
                for (let k = 0; k < gapLineIndices.length; k++) {
                    const gi = gapLineIndices[k];
                    if (gi !== activeIndex) setGapOpen(gi, false);
                }

                // 天际屏换句
                if (lyricLines[activeIndex]) buildBackgroundArt(activeIndex);

                updateActiveLine(activeIndex, currentProgress);

                // 等待点行的展开/合拢会在 620ms 内把它下方的歌词整体推移几十像素：
                // 这时不能用"一次性算好目标的滑动动画"（目标会过期 → 结束后偏几十像素
                // → 只能再补一次校正，看起来就是过冲）。改为这一段时间里连续跟随居中。
                const activeIsGap = !!(lyricLines[activeIndex] && lyricLines[activeIndex].isGap);
                const prevIsGap = !!(prevIndex >= 0 && lyricLines[prevIndex] && lyricLines[prevIndex].isGap);
                if (activeIsGap || prevIsGap) {
                    requestAnimationFrame(() => { if (currentActiveLineIndex === activeIndex) gapScroll(activeIndex); });
                } else {
                    requestAnimationFrame(() => scrollToIndex(activeIndex));
                }
            }

            // ==================== 专辑封面 & 取色 ====================
            function updateAlbumArt(picUrl) {
                picUrl = parseEventData(picUrl);
                if (!picUrl || picUrl === 'null' || picUrl === 'undefined') return;
                if (picUrl === currentPicUrl) return;
                currentPicUrl = picUrl;
                console.log('[封面] 更新:', picUrl.slice(0, 80));
                loadAlbumArt(picUrl, true);
            }

            // 加载封面：优先带 crossorigin（可取色），失败再去掉 crossorigin 重试（至少能显示）
            function loadAlbumArt(url, withCors) {
                const handleLoad = () => {
                    albumArtEl.classList.add('visible');
                    if (!withCors) {
                        // 无 CORS 的图片无法在 canvas 取色 → 用歌名派生的兜底色
                        applyBgColor(fallbackColorFromName(currentSongName));
                        return;
                    }
                    extractColorFromImage(albumArtEl).then(color => {
                        if (color) {
                            console.log('[取色] 主色:', color.r, color.g, color.b);
                            applyBgColor(color);
                        } else {
                            applyBgColor(fallbackColorFromName(currentSongName));
                        }
                    });
                };

                const handleError = () => {
                    console.warn('[封面] 图片加载失败 (crossorigin=' + withCors + ')');
                    if (withCors) {
                        loadAlbumArt(url, false);   // 图床不支持 CORS，退回纯显示
                    } else {
                        albumArtEl.classList.remove('visible');
                        applyBgColor(fallbackColorFromName(currentSongName));
                    }
                };

                if (withCors) albumArtEl.setAttribute('crossorigin', 'anonymous');
                else albumArtEl.removeAttribute('crossorigin');
                albumArtEl.onload = handleLoad;
                albumArtEl.onerror = handleError;
                albumArtEl.src = url;

                // 命中的缓存图片可能不触发 onload
                if (albumArtEl.complete && albumArtEl.naturalWidth > 0) handleLoad();
            }

            // 从图片提取主色（需要 CORS 可用，酷狗图床已返回 Access-Control-Allow-Origin: *）
            function extractColorFromImage(imgEl) {
                return new Promise((resolve) => {
                    try {
                        const canvas = document.createElement('canvas');
                        const size = 32;
                        canvas.width = size;
                        canvas.height = size;
                        const ctx = canvas.getContext('2d', { willReadFrequently: true });
                        ctx.drawImage(imgEl, 0, 0, size, size);
                        const data = ctx.getImageData(0, 0, size, size).data;

                        let r = 0, g = 0, b = 0, count = 0;
                        // 以"饱和度"为权重的平均，跳过近黑/近白，取到的颜色更像封面主色
                        for (let i = 0; i < data.length; i += 4) {
                            const rr = data[i], gg = data[i + 1], bb = data[i + 2], aa = data[i + 3];
                            if (aa < 128) continue;
                            const lum = 0.299 * rr + 0.587 * gg + 0.114 * bb;
                            if (lum < 20 || lum > 235) continue;
                            const mx = Math.max(rr, gg, bb), mn = Math.min(rr, gg, bb);
                            const sat = mx === 0 ? 0 : (mx - mn) / mx;
                            const w = 0.35 + sat;
                            r += rr * w; g += gg * w; b += bb * w;
                            count += w;
                        }

                        if (count === 0) { resolve(null); return; }
                        resolve({ r: Math.round(r / count), g: Math.round(g / count), b: Math.round(b / count) });
                    } catch (e) {
                        console.warn('[取色] 失败（可能跨域）:', e.message);
                        resolve(null);
                    }
                });
            }

            // 保证光晕始终看得见：亮度不足就提亮，偏灰就增饱和
            function vividColor(color) {
                let { r, g, b } = color;
                const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                if (lum < 80) {
                    const k = 80 / Math.max(1, lum);
                    r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k);
                } else if (lum > 200) {
                    const k = 200 / lum;
                    r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k);
                }
                const mid = (Math.max(r, g, b) + Math.min(r, g, b)) / 2;
                const boost = 1.4;
                r = Math.min(255, Math.max(0, Math.round(mid + (r - mid) * boost)));
                g = Math.min(255, Math.max(0, Math.round(mid + (g - mid) * boost)));
                b = Math.min(255, Math.max(0, Math.round(mid + (b - mid) * boost)));
                return { r, g, b };
            }

            // 取色失败时的兜底色：由歌名派生，保证换歌背景色也会变
            function fallbackColorFromName(name) {
                let h = 0;
                const s = name || 'music';
                for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
                return hslToRgb(h / 360, 0.62, 0.5);
            }

            function hslToRgb(h, s, l) {
                const k = n => (n + h * 12) % 12;
                const a = s * Math.min(l, 1 - l);
                const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
                return { r: Math.round(f(0) * 255), g: Math.round(f(8) * 255), b: Math.round(f(4) * 255) };
            }

            function applyBgColor(color) {
                const { r, g, b } = vividColor(color);
                const rgba1 = `rgba(${r}, ${g}, ${b}, 0.72)`;
                const rgba2 = `rgba(${Math.round(r * 0.5)}, ${Math.round(g * 0.5)}, ${Math.round(b * 0.5)}, 0.42)`;
                const transparent = `rgba(${r}, ${g}, ${b}, 0)`;

                bgPulseLayerEl.style.background =
                    `radial-gradient(circle at 50% 45%, ${rgba1}, ${rgba2} 40%, ${transparent} 70%)`;

                const stageR = Math.round(r * 0.3 + 8);
                const stageG = Math.round(g * 0.3 + 8);
                const stageB = Math.round(b * 0.3 + 14);
                lyricStageEl.style.background =
                    `radial-gradient(circle at 50% 45%, rgba(${stageR}, ${stageG}, ${stageB}, 0.95), rgba(6, 6, 10, 0.99) 75%)`;
            }

            // ==================== 背景律动 ====================
            function startBgPulse() {
                if (bgPulseRunning) return;
                bgPulseRunning = true;
                bgPulseStart = performance.now();

                function frame(now) {
                    if (!bgPulseRunning) return;
                    const t = (now - bgPulseStart) / 1000;
                    const s = Math.sin(t * 1.15);
                    const s2 = Math.sin(t * 2.3);
                    const scale = 1 + s * 0.08 + s2 * 0.025;
                    const opacity = (0.62 + s * 0.14) * bgPulseK;
                    bgPulseLayerEl.style.transform = `scale(${scale.toFixed(4)})`;
                    bgPulseLayerEl.style.opacity = opacity.toFixed(3);
                    bgPulseRafId = requestAnimationFrame(frame);
                }
                bgPulseRafId = requestAnimationFrame(frame);
            }

            function stopBgPulse() {
                bgPulseRunning = false;
                if (bgPulseRafId) {
                    cancelAnimationFrame(bgPulseRafId);
                    bgPulseRafId = null;
                }
            }

            // ==================== 背景艺术字 ====================
            // 漂移幅度上限：摆放时按「最坏情况」预留，保证
            //   ① 任何一段在屏幕外的部分都远不到它自己的一半；
            //   ② 相邻两段永远不会压到一起。
            const BG_OX = 6, BG_AX = 12;    // 横向：固定偏移 ±6，正弦振幅 ≤12
            const BG_OY = 6, BG_AY = 8;     // 纵向
            const BG_ROT_DEG = 5.5;         // 旋转最大角度
            const BG_DX_MAX = BG_OX + BG_AX;   // 横向最大位移
            const BG_DY_MAX = BG_OY + BG_AY;   // 纵向最大位移
            const BG_PAD_X = BG_DX_MAX + 10;   // 10 ≈ 旋转后的包围盒增量
            const BG_PAD_Y = BG_DY_MAX + 10;

            function ovlArea(a, b) {
                const w = Math.min(a.r, b.r) - Math.max(a.l, b.l);
                const h = Math.min(a.b, b.b) - Math.max(a.t, b.t);
                return (w > 0 && h > 0) ? w * h : 0;
            }

            // 摆放：按「真实测量出的宽高」做不重叠贪心布局。
            // 为什么必须测量：Any Listen 歌词里一个 <start,dur> 片段可能是一整个
            // 短语（如 "Welcome "），宽度可达字号的十倍以上；
            // 按"字号≈宽度"去估算，必然既甩出屏幕又互相压叠。
            function placeBgChars(boxes, W, H) {
                const out = new Array(boxes.length).fill(null);
                const order = [];
                for (let i = 0; i < boxes.length; i++) order.push(i);
                // 先摆最大的（最难放）
                order.sort((a, b) => boxes[b].w * boxes[b].h - boxes[a].w * boxes[a].h);

                // 焦点歌词所在的中心区域：尽量让开
                const safeW = W * 0.34, safeH = H * 0.36;
                const safe = {
                    l: (W - safeW) / 2, t: (H - safeH) / 2,
                    r: (W + safeW) / 2, b: (H + safeH) / 2
                };

                const kept = [];
                for (let k = 0; k < order.length; k++) {
                    const i = order[k];
                    const w = boxes[i].w, h = boxes[i].h;
                    // 允许范围已包含"漂移到最远端"的余量，所以任何时刻都不会有一半以上出屏
                    let loX = BG_PAD_X, hiX = W - w - BG_PAD_X;
                    let loY = BG_PAD_Y, hiY = H - h - BG_PAD_Y;
                    if (hiX < loX) loX = hiX = Math.max(0, (W - w) / 2);
                    if (hiY < loY) loY = hiY = Math.max(0, (H - h) / 2);

                    let best = null, bestPenalty = Infinity;
                    for (let attempt = 0; attempt < 180; attempt++) {
                        const x = loX + Math.random() * (hiX - loX);
                        const y = loY + Math.random() * (hiY - loY);
                        const r = {
                            l: x - BG_PAD_X, t: y - BG_PAD_Y,
                            r: x + w + BG_PAD_X, b: y + h + BG_PAD_Y
                        };
                        let pen = 0;
                        for (let q = 0; q < kept.length; q++) pen += ovlArea(r, kept[q]);
                        pen += ovlArea(r, safe) * 0.75;
                        if (pen <= 0) { best = { x, y }; bestPenalty = 0; break; }
                        if (pen < bestPenalty) { bestPenalty = pen; best = { x, y }; }
                    }
                    out[i] = best;
                    if (best) {
                        kept.push({
                            l: best.x - BG_PAD_X, t: best.y - BG_PAD_Y,
                            r: best.x + w + BG_PAD_X, b: best.y + h + BG_PAD_Y
                        });
                    }
                }
                return out;
            }

            function clearBgChars() {
                if (bgAnimationId) {
                    cancelAnimationFrame(bgAnimationId);
                    bgAnimationId = null;
                }
                if (bgBuildTimer) {
                    clearTimeout(bgBuildTimer);
                    bgBuildTimer = null;
                }
                bgBuildToken++;            // 作废所有在途的异步回调
                bgChars = [];
                bgFloat = [];
                bgRevealPtr = 0;
                bgArtLayerEl.innerHTML = '';
                bgArtLayerEl.classList.remove('visible');
            }

            function buildBackgroundArt(lineIdx) {
                const line = lyricLines[lineIdx];

                // 同一句不重复重建（避免闪烁）
                if (bgCurrentLineIndex === lineIdx && bgArtLayerEl.children.length > 0) return;

                // 间奏等待点没有歌词文本，但背景要换成"音符图标"（见 createBgChars），
                // 所以这里不再提前 return，而是走下面统一的交叉过渡路径。
                if (!line || (!line.text && !line.isGap)) {
                    bgCurrentLineIndex = lineIdx;
                    clearBgChars();
                    return;
                }
                bgCurrentLineIndex = lineIdx;

                // 旧批立刻开始淡出（0.42s），新批在同一时刻就建出来：
                // 这样新句第一段的浮现时刻 = 它真正被唱到的时刻，
                // 不会因为"等旧批淡完再建"而让整句挤在一起冒出来。
                const old = bgArtLayerEl.lastElementChild;
                if (old) {
                    old.classList.add('fade-out');
                    setTimeout(() => {
                        if (old.parentNode === bgArtLayerEl) old.remove();
                    }, 460);
                }

                if (bgAnimationId) { cancelAnimationFrame(bgAnimationId); bgAnimationId = null; }
                bgBuildToken++;          // 换批代次（也便于外部探针识别"这是新的一批"）
                bgChars = [];
                bgFloat = [];
                bgRevealPtr = 0;
                createBgChars(line);
            }

            // 间奏期间背景用的音符图标（替代歌词）
            const GAP_NOTES = ['🎵', '♪', '♫', '♩', '~', '🎶', '♬'];

            function createBgChars(line) {
                const text = line.text || '';
                const chars = (line.chars && line.chars.length > 0) ? line.chars : null;

                let charList;
                if (line.isGap) {
                    // 间奏等待点：这段没有歌词可显示，就用一串音符图标代替，
                    // 让"这一段没人唱"本身成为一种画面。
                    // 只在等待开始后的一小段时间里陆续浮现，之后保持漂浮——
                    // 这样几十秒的长间奏也不会让背景一直空着。
                    const dur = Math.max(1.2, (line.endTime || 0) - line.time);
                    const spread = Math.min(dur * 0.42, 9);
                    const n = GAP_NOTES.length;
                    charList = [];
                    for (let i = 0; i < n; i++) {
                        charList.push({
                            char: GAP_NOTES[i],
                            revealTime: line.time - BG_ANTICIPATE + spread * ((i + 1) / (n + 1)),
                            isNote: true
                        });
                    }
                } else if (chars) {
                    charList = [];
                    for (let i = 0; i < chars.length; i++) {
                        const c = chars[i];
                        if (!c || !c.char) continue;
                        charList.push({ char: c.char, revealTime: c.time - BG_ANTICIPATE });
                    }
                } else {
                    // 标准 LRC 没有逐字时间：按字数把整句摊到它的演唱时长上，
                    // 这样"唱到哪个字就出现哪个字"的效果对纯 LRC 也成立，
                    // 而不是整句字一次性全冒出来。
                    const extracted = (text || '').match(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7afA-Za-z0-9]/g) || [];
                    const n = extracted.length;
                    const rawDur = (typeof line.endTime === 'number' && isFinite(line.endTime))
                        ? (line.endTime - line.time) : 0;
                    const dur = Math.max(0.9, Math.min(rawDur > 0 ? rawDur : n * 0.34, 14));
                    charList = extracted.map((ch, i) => ({
                        char: ch,
                        revealTime: line.time - BG_ANTICIPATE + dur * (i / Math.max(1, n)) * 0.92
                    }));
                }

                if (charList.length === 0) return;

                // 保证 revealTime 递增，revealBgChars 才能用单指针 O(1) 推进
                charList.sort((a, b) => {
                    const ta = a.revealTime === null ? Infinity : a.revealTime;
                    const tb = b.revealTime === null ? Infinity : b.revealTime;
                    return ta - tb;
                });

                const W = window.innerWidth;
                const H = window.innerHeight;

                const batch = document.createElement('div');
                batch.className = 'bg-batch';
                bgArtLayerEl.appendChild(batch);
                bgArtLayerEl.classList.add('visible');

                bgChars = [];
                bgFloat = [];
                bgRevealPtr = 0;

                // ① 先按初始字号造出元素并挂到页面上——只有真正渲染过，
                //    才能量到「这段话实际有多宽」（短语可能宽达字号十倍）。
                //    间奏的音符图标整体小一档：它们是背景装饰，不该压过歌词。
                const baseSize = line.isGap
                    ? Math.min(W / (charList.length * 2.6), H * 0.15)
                    : Math.min(W / (charList.length * 1.6), H * 0.22);
                const spans = [];
                for (let i = 0; i < charList.length; i++) {
                    const span = document.createElement('span');
                    span.className = charList[i].isNote ? 'bg-char bg-note' : 'bg-char';
                    span.textContent = charList[i].char;
                    span.style.fontSize = `${(baseSize * (0.72 + Math.random() * 0.42)).toFixed(1)}px`;
                    batch.appendChild(span);
                    spans.push(span);
                }

                // ② 量真实宽高（一次布局）。
                //    必须用 offsetWidth/offsetHeight —— 它们是布局尺寸，不受
                //    transform 影响；而"未出现"状态下字还带着 scale:0.82，
                //    用 getBoundingClientRect 会量到缩小 18% 的框，
                //    浮现到 scale:1 后就会比计划的大一圈。
                const boxes = [];
                for (let i = 0; i < spans.length; i++) {
                    boxes.push({
                        w: Math.max(4, spans[i].offsetWidth),
                        h: Math.max(4, spans[i].offsetHeight)
                    });
                }

                // ③ 面积预算：总墨量不超过视口的一定比例，否则根本摆不开。
                //    超了就整体等比缩小（字号与宽高同步缩放）。
                let totalArea = 0;
                for (let i = 0; i < boxes.length; i++) totalArea += boxes[i].w * boxes[i].h;
                const budget = W * H * 0.42;
                const kGlobal = totalArea > budget ? Math.sqrt(budget / totalArea) : 1;
                for (let i = 0; i < spans.length; i++) {
                    let k = kGlobal;
                    const maxW = W * 0.62;                       // 单段不超过视口宽度的 62%
                    if (boxes[i].w * k > maxW) k = maxW / boxes[i].w;
                    if (k < 0.999) {
                        const cur = parseFloat(spans[i].style.fontSize) || baseSize;
                        spans[i].style.fontSize = `${(cur * k).toFixed(1)}px`;
                        boxes[i].w *= k;
                        boxes[i].h *= k;
                    }
                }

                // ④ 不重叠摆放（含漂移与旋转的余量）
                const pos = placeBgChars(boxes, W, H);

                // ⑤ 落位 + 漂移参数
                for (let i = 0; i < spans.length; i++) {
                    const span = spans[i];
                    const p = pos[i];
                    if (!p) { span.remove(); continue; }         // 实在摆不下就少放一段
                    span.style.left = `${p.x.toFixed(1)}px`;
                    span.style.top = `${p.y.toFixed(1)}px`;

                    // 漂移参数缓存在 JS 里，避免每帧读 dataset。
                    // 振幅上限与 BG_OX/BG_AX（BG_OY/BG_AY）严格对应——
                    // 摆放时的留白就是按这些上限算的，改这里必须同步改常量。
                    bgFloat.push({
                        ox: (Math.random() - 0.5) * 2 * BG_OX,
                        oy: (Math.random() - 0.5) * 2 * BG_OY,
                        ax: BG_AX * 0.35 + Math.random() * BG_AX * 0.65,
                        sx: 0.0004 + Math.random() * 0.0006,
                        px: Math.random() * Math.PI * 2,
                        ay: BG_AY * 0.35 + Math.random() * BG_AY * 0.65,
                        sy: 0.0003 + Math.random() * 0.0005,
                        py: Math.random() * Math.PI * 2,
                        ar: 1.5 + Math.random() * (BG_ROT_DEG - 1.5),
                        sr: 0.0002 + Math.random() * 0.0003,
                        pr: Math.random() * Math.PI * 2
                    });

                    // 出现时刻：进度走到该段的演唱时刻才浮现（唯一判据）
                    const rt = charList[i].revealTime;
                    span._rt = (rt !== null && rt !== undefined && isFinite(rt)) ? rt : null;

                    bgChars.push(span);
                }

                // 强制一次样式结算：让浏览器先以「未出现」的状态提交这批新节点，
                // 否则插入与加 .revealed 落在同一帧里不会触发过渡，字会"啪"地出现。
                void batch.offsetWidth;

                // 立刻结算已经到点的字（拖进度、切歌回到句中时需要），
                // 剩下的交给 rAF 在各自的演唱时刻依次浮现
                revealBgChars(currentProgress);
                startBgAnimation();
            }

            // 逐字出现：唯一判据是「进度到达该字的演唱时刻」——
            // 也就是前景唱到哪个字，背景才浮现哪个字。
            // 字符按时间递增，所以用单指针 O(1) 推进即可。
            function revealBgChars(progress) {
                while (bgRevealPtr < bgChars.length) {
                    const el = bgChars[bgRevealPtr];
                    if (!el) { bgRevealPtr++; continue; }
                    const rt = el._rt;
                    if (rt !== null && rt !== undefined && progress < rt) break;
                    if (!el.classList.contains('revealed')) el.classList.add('revealed');
                    bgRevealPtr++;
                }
            }

            // 拖动进度条回跳时，重新对齐逐字出现状态
            function resyncBgReveals(progress) {
                bgRevealPtr = 0;
                for (let i = 0; i < bgChars.length; i++) {
                    const el = bgChars[i];
                    if (!el) continue;
                    const rt = el._rt;
                    const revealed = (rt === null || rt === undefined) || progress >= rt;
                    if (revealed) {
                        if (!el.classList.contains('revealed')) el.classList.add('revealed');
                        if (rt !== null && rt !== undefined) bgRevealPtr = i + 1;
                    } else if (el.classList.contains('revealed')) {
                        el.classList.remove('revealed');
                    }
                }
            }

            function startBgAnimation() {
                if (bgAnimationId) cancelAnimationFrame(bgAnimationId);
                if (bgChars.length === 0) return;
                bgStartTime = performance.now();

                function frame(now) {
                    const t = now - bgStartTime;
                    // 暂停/停止时进度循环不在跑，这里兜底推进出现节拍
                    revealBgChars(currentProgress);
                    const len = bgChars.length;
                    for (let i = 0; i < len; i++) {
                        const el = bgChars[i];
                        const f = bgFloat[i];
                        if (!el || !f) continue;
                        const dx = f.ox + Math.sin(t * f.sx + f.px) * f.ax;
                        const dy = f.oy + Math.cos(t * f.sy + f.py) * f.ay;
                        const rot = Math.sin(t * f.sr + f.pr) * f.ar;
                        el.style.transform = `translate3d(${dx.toFixed(2)}px, ${dy.toFixed(2)}px, 0) rotate(${rot.toFixed(2)}deg)`;
                    }
                    bgAnimationId = requestAnimationFrame(frame);
                }
                bgAnimationId = requestAnimationFrame(frame);
            }

            // ==================== 歌词应用 ====================
            function applyLyric(lrcText) {
                // 解析后插入"间奏等待点"行：空档 > 5s 的地方各插一行 · · ·
                lyricLines = insertGapLines(parseLyric(lrcText));

                // 换歌：先结算/停掉在跑的滚动动画，避免旧的位移残留到新列表
                if (scrollAnim) { scrollAnim.cancel(); scrollAnim = null; }
                if (lyricListEl) lyricListEl.style.transform = '';
                gapFollowStop();          // 换歌重排：正在跟随的滚动循环必须停掉

                lyricListEl.innerHTML = '';
                lyricLineElements = [];
                lyricCharElements = [];
                charState = [];
                charLit = [];
                lineClassCache = [];
                gapLineIndices = [];
                currentActiveLineIndex = -1;
                bgCurrentLineIndex = -1;
                clearBgChars();

                if (lyricLines.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-lyric';
                    empty.textContent = '暂无歌词';
                    lyricListEl.appendChild(empty);
                    lyricLineElements.push(empty);
                    lyricCharElements.push(null);
                    updateListPadding();
                    return;
                }

                const fragment = document.createDocumentFragment();
                lyricLines.forEach((line, li) => {
                    const lineEl = document.createElement('div');
                    lineEl.className = line.isGap ? 'lyric-line gap-line' : 'lyric-line';
                    lineEl.dataset.time = line.time;
                    if (line.isGap) gapLineIndices.push(li);

                    let charEls = null;
                    if (line.isGap) {
                        // 间奏等待点：三个点放在裁切层里（折叠时整层被裁成 0 高）
                        charEls = [];
                        const inner = document.createElement('div');
                        inner.className = 'gap-inner';
                        for (let k = 0; k < 3; k++) {
                            const dot = document.createElement('span');
                            dot.className = 'gap-dot';
                            inner.appendChild(dot);
                            charEls.push(dot);
                        }
                        lineEl.appendChild(inner);
                    } else if (line.chars && line.chars.length > 0) {
                        charEls = [];
                        line.chars.forEach(c => {
                            const span = document.createElement('span');
                            span.className = 'lyric-char unsung';
                            span.textContent = c.char;
                            span.dataset.time = c.time;
                            span.dataset.endTime = c.endTime;
                            lineEl.appendChild(span);
                            charEls.push(span);
                        });
                    } else {
                        lineEl.textContent = line.text || '♪';
                    }

                    fragment.appendChild(lineEl);
                    lyricLineElements.push(lineEl);
                    lyricCharElements.push(charEls);
                });
                lyricListEl.appendChild(fragment);

                updateListPadding();
                updateGapWidth();   // 等宽量到后，等待点才知道自己该站哪

                if (playerStatus === 'playing' || playerStatus === 'paused') {
                    const idx = findActiveLineIndex(currentProgress);
                    updateHighlight(idx, true);
                    applyProgress(currentProgress);
                    scrollToIndex(idx, true);   // 换歌后直接定位，不做长距离滚动
                } else if (lyricLineElements.length > 0) {
                    updateHighlight(0, false);
                    scrollToIndex(0, true);
                }
            }

            async function fetchLyric(force = false) {
                const songKey = `${currentSongName}__${currentSinger}`;
                if (!force && songKey === lastFetchSongKey && lyricLines.length > 0) return;
                lastFetchSongKey = songKey;

                try {
                    const res = await fetch(LYRIC_ALL_URL);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();

                    let lrcText = data.lxlyric;
                    if (!lrcText || !lrcText.trim()) {
                        lrcText = data.lyric || '';
                    }

                    applyLyric(lrcText);
                    trackNameEl.textContent = currentSongName || '—';
                    trackSingerEl.textContent = currentSinger || '—';
                } catch (err) {
                    console.error('获取歌词失败:', err);
                    lyricListEl.innerHTML = '<div class="empty-lyric">歌词加载失败，请检查服务</div>';
                    lyricLineElements = [];
                    lyricCharElements = [];
                    lyricLines = [];
                }
            }

            // 拉取 /status 获取 picUrl
            async function fetchStatus() {
                try {
                    const res = await fetch(STATUS_URL);
                    if (!res.ok) return;
                    const data = await res.json();
                    console.log('[状态] picUrl:', data.picUrl ? data.picUrl.slice(0, 80) : '（无）');
                    // 歌曲总时长（进度条的分母）
                    if (typeof data.duration === 'number' && isFinite(data.duration) && data.duration > 0) {
                        trackDuration = data.duration;
                        updateProgressUI(currentProgress);
                    }
                    if (data.picUrl) {
                        updateAlbumArt(data.picUrl);
                    } else {
                        // 状态里没有封面，尝试从已有封面获取
                        if (!currentPicUrl) {
                            applyBgColor({ r: 60, g: 90, b: 160 });
                        }
                    }
                    // 如果状态里有歌名/歌手，也更新一下
                    if (data.name && data.name !== currentSongName) {
                        currentSongName = data.name;
                        trackNameEl.textContent = data.name;
                    }
                    if (data.singer && data.singer !== currentSinger) {
                        currentSinger = data.singer;
                        trackSingerEl.textContent = data.singer;
                    }
                    // 同步播放状态（SSE 未连接时的兜底）
                    if (data.status && data.status !== playerStatus &&
                        performance.now() >= ctrlPendingUntil) {
                        playerStatus = data.status;
                        renderStatusBadge();
                        setPlayingUI(playerStatus === 'playing');
                    }
                    // 控件相关字段：收藏 / 音量 / 静音
                    if (data.collect !== undefined) syncCtrlState('collect', data.collect);
                    if (data.volume !== undefined) syncCtrlState('volume', data.volume);
                    if (data.mute !== undefined) syncCtrlState('mute', data.mute);
                    if (data.status === 'playing') {
                        setClockRate(data.playbackRate);
                        resumeClock();
                        startBgPulse();
                        startProgressLoop();
                    } else if (data.status === 'paused') {
                        freezeClock();
                        startProgressLoop();
                    }
                    // 同步进度：只作为时钟的误差校正源，扫光的连续性由本地时钟保证
                    if (typeof data.progress === 'number' && isFinite(data.progress)) {
                        syncClock(data.progress);
                        if (!progressRunning) {
                            currentProgress = clockProgress(nowSec());
                            applyProgress(currentProgress);
                        }
                    }
                } catch (e) {
                    console.warn('拉取状态失败', e);
                }
            }

            function scheduleFetchLyric() {
                if (fetchTimer) clearTimeout(fetchTimer);
                fetchTimer = setTimeout(() => fetchLyric(true), 300);
            }

            // 防抖拉取状态，避免多条事件同时触发刷封面
            function scheduleFetchStatus(delay = 150) {
                if (statusFetchTimer) clearTimeout(statusFetchTimer);
                statusFetchTimer = setTimeout(() => {
                    statusFetchTimer = null;
                    fetchStatus().catch(() => {});
                }, delay);
            }

            function initSSE() {
                if (typeof EventSource === 'undefined') {
                    setConnState('err', '浏览器不支持 SSE');
                    return;
                }
                const es = new EventSource(SSE_URL);

                es.onopen = () => { setConnState('ok', '已连接'); };
                es.onerror = (err) => {
                    console.error('SSE 错误:', err);
                    setConnState('err', '连接中断，重试中…');
                };

                es.addEventListener('status', (e) => {
                    const st = String(parseEventData(e.data) || 'stoped');
                    // 刚点过播放/暂停：先以本地为准，等权威状态追上来（否则会被旧事件打回去）
                    if (performance.now() < ctrlPendingUntil) return;
                    if (st === playerStatus) return;      // 状态未变化，不重复处理
                    playerStatus = st;
                    renderStatusBadge();
                    setPlayingUI(st === 'playing');
                    if (st === 'playing') {
                        resumeClock();
                        startBgPulse();
                        startProgressLoop();
                        scheduleFetchStatus();
                    } else if (st === 'paused') {
                        // 暂停：冻结时钟（位置停在原地），但循环继续跑以便拖动时立刻响应
                        freezeClock();
                        startProgressLoop();
                        scheduleFetchStatus();
                    } else {
                        freezeClock();
                        stopBgPulse();
                        stopProgressLoop();
                        applyProgress(clockProgress(nowSec()));
                    }
                });

                es.addEventListener('name', (e) => {
                    const name = parseEventData(e.data);
                    if (name && currentSongName !== name) {
                        currentSongName = name;
                        trackNameEl.textContent = name || '—';
                        resetClock();          // 新歌：进度归零，等权威进度再起跑
                        scheduleFetchLyric();
                        scheduleFetchStatus();
                    }
                });

                es.addEventListener('singer', (e) => {
                    const singer = parseEventData(e.data);
                    if (singer && currentSinger !== singer) {
                        currentSinger = singer;
                        trackSingerEl.textContent = singer || '—';
                    }
                });

                // 监听 picUrl 事件（注意 filter 必须包含 picUrl 才会推送）
                es.addEventListener('picUrl', (e) => {
                    const url = parseEventData(e.data);
                    if (url && url !== 'null' && url !== 'undefined' &&
                        (url.startsWith('http') || url.startsWith('data:'))) {
                        updateAlbumArt(url);
                    }
                });

                es.addEventListener('progress', (e) => {
                    // data 可能是 JSON 编码的数值，统一解码
                    const p = parseFloat(parseEventData(e.data));
                    if (isNaN(p)) return;

                    const advancing = p > targetProgress + 0.05;
                    // 只做「误差吸收」，扫光的每帧推进由本地时钟提供 → 连续无脉冲
                    syncClock(p);

                    if (progressRunning) return;

                    // 兜底：万一漏了 status 事件，只要进度在推进就按播放处理
                    if (advancing && playerStatus !== 'paused') {
                        playerStatus = 'playing';
                        renderStatusBadge();
                        setPlayingUI(true);
                        resumeClock();
                        startBgPulse();
                        startProgressLoop();
                        scheduleFetchStatus();
                        return;
                    }
                    currentProgress = clockProgress(nowSec());
                    applyProgress(currentProgress);
                });

                es.addEventListener('playbackRate', (e) => {
                    setClockRate(parseFloat(parseEventData(e.data)));
                });

                // 播放控件的三个字段（filter 里必须带上才会推送）
                es.addEventListener('collect', (e) => syncCtrlState('collect', e.data));
                es.addEventListener('volume', (e) => syncCtrlState('volume', e.data));
                es.addEventListener('mute', (e) => syncCtrlState('mute', e.data));

                // 总时长（进度条分母）；切换 /status 拉取时已兜底
                es.addEventListener('duration', (e) => {
                    const d = parseFloat(parseEventData(e.data));
                    if (isFinite(d) && d > 0 && Math.abs(d - trackDuration) > 0.5) {
                        trackDuration = d;
                        updateProgressUI(currentProgress);
                    }
                });

                es.addEventListener('lxlyric', (e) => {
                    if (e.data && e.data !== 'null' && lyricLines.length === 0) {
                        scheduleFetchLyric();
                    }
                });
            }

            // ==================== 底部连接状态条 ====================
            // 一行横向排布：● 连接状态 / 播放器状态 / IP / 端口 / 协议
            function renderStatusBadge() {
                if (sbDotEl) sbDotEl.className = 'sb-dot ' + connState;
                if (sbStateEl) sbStateEl.textContent = connText;
                if (cbPlayerEl) {
                    cbPlayerEl.textContent =
                        playerStatus === 'playing' ? '播放中'
                        : playerStatus === 'paused' ? '已暂停'
                        : playerStatus === 'error' ? '播放出错'
                        : '未播放';
                }
            }

            function setConnState(state, text) {
                connState = state;
                connText = text;
                renderStatusBadge();
            }

            function fillEndpointInfo() {
                try {
                    const u = new URL(API_BASE);
                    if (sbIpEl) sbIpEl.textContent = u.hostname || '127.0.0.1';
                    if (sbPortEl) sbPortEl.textContent = u.port || (u.protocol === 'https:' ? '443' : '80');
                } catch (e) {
                    if (sbIpEl) sbIpEl.textContent = '127.0.0.1';
                    if (sbPortEl) sbPortEl.textContent = '23330';
                }
            }

            // ==================== 右下角播放控件 ====================
            // 这些控制接口都是 GET，且返回体用不上；失败一律静默
            // （本地服务没开时不该影响歌词本身）。
            // 先按 cors 发；若被 CORS 拦下，再用 no-cors 发一次——
            // 后者读不到响应，但请求本身能到服务端，控制动作照样生效。
            function ctrlFetch(url) {
                return fetch(url).catch(() => fetch(url, { mode: 'no-cors' })).catch(() => {});
            }

            function setPlayingUI(playing) {
                if (playerBarEl) playerBarEl.classList.toggle('playing', !!playing);
            }

            function togglePlay() {
                const wantPlaying = (playerStatus !== 'playing');
                // 乐观更新：立刻反映到图标与状态条，随后由 SSE / status 校正
                playerStatus = wantPlaying ? 'playing' : 'paused';
                setPlayingUI(wantPlaying);
                renderStatusBadge();
                ctrlPendingUntil = performance.now() + 1200;
                if (wantPlaying) {
                    resumeClock();
                    startBgPulse();
                    startProgressLoop();
                    ctrlFetch(CTRL_PLAY);
                } else {
                    // 暂停：冻结时钟（位置停在原地），但循环继续跑
                    freezeClock();
                    startProgressLoop();
                    ctrlFetch(CTRL_PAUSE);
                }
            }

            function skipNext() { ctrlFetch(CTRL_NEXT); }
            function skipPrev() { ctrlFetch(CTRL_PREV); }

            // ==================== 可拖动条：一个控制器，两处复用 ====================
            // 进度条与音量条共用同一套手势代码，避免"两处各修一遍、各留一个 bug"。
            //
            // 要点：pointermove / pointerup 挂在 window 上，而不是只挂在被拖的元素上。
            //   · 指针捕获（setPointerCapture）在个别环境会抛错或静默失效；
            //   · 即便捕获成功，横向拖长条时指针纵向漂出元素也很常见。
            // 一旦 pointerup 落在元素外收不到，状态位就会永远停在「拖动中」，
            // 进度条此后被 updateProgressUI 里的 `if (seeking) return` 冻住，只剩点击能用
            // （这正是"拖不动、只能点"的成因）。挂到 window 后抬手必然收得到；
            // 另外补 mousemove / mouseup 兜底（极少数环境只投递鼠标事件不投递指针事件），
            // 两种事件重复到达对结果无副作用（同一坐标写同一个值）。
            function bindSlider(opts) {
                const el = opts.el;
                if (!el) return null;
                const st = { dragging: false, pointerId: null };

                const ratioOf = (clientX) => {
                    const r = el.getBoundingClientRect();
                    if (!(r.width > 0)) return null;
                    return Math.max(0, Math.min(1, (clientX - r.left) / r.width));
                };

                const onMove = (e) => {
                    if (!st.dragging) return;
                    // 只认按下时的那根指针，多指/右键乱入时不会串台
                    if (st.pointerId !== null && e.pointerId !== undefined && e.pointerId !== st.pointerId) return;
                    if (e.cancelable) e.preventDefault();
                    const r = ratioOf(e.clientX);
                    if (r !== null) opts.onMove(r);
                };

                const end = (e, commit) => {
                    if (!st.dragging) return;
                    st.dragging = false;
                    st.pointerId = null;
                    window.removeEventListener('pointermove', onMove, true);
                    window.removeEventListener('pointerup', onUp, true);
                    window.removeEventListener('pointercancel', onCancel, true);
                    window.removeEventListener('mousemove', onMove, true);
                    window.removeEventListener('mouseup', onUp, true);
                    window.removeEventListener('blur', onBlur);
                    el.classList.remove('dragging');
                    if (e && e.pointerId !== undefined) {
                        try { el.releasePointerCapture(e.pointerId); } catch (err) {}
                    }
                    opts.onEnd(commit);
                };
                const onUp = (e) => end(e, true);
                const onCancel = (e) => end(e, false);
                // 窗口失焦（切走 / 锁屏）也要收尾，否则同样会卡在"拖动中"
                const onBlur = () => end(null, true);

                const start = (e) => {
                    if (st.dragging) return;
                    if (e.button !== undefined && e.button > 0) return;
                    if (!opts.usable()) return;
                    st.dragging = true;
                    st.pointerId = (e.pointerId === undefined) ? null : e.pointerId;
                    if (e.cancelable) e.preventDefault();
                    // 捕获只是锦上添花（让 hover / 光标留在原元素上），失败也不影响拖动
                    try { el.setPointerCapture(e.pointerId); } catch (err) {}
                    el.classList.add('dragging');
                    window.addEventListener('pointermove', onMove, true);
                    window.addEventListener('pointerup', onUp, true);
                    window.addEventListener('pointercancel', onCancel, true);
                    window.addEventListener('mousemove', onMove, true);
                    window.addEventListener('mouseup', onUp, true);
                    window.addEventListener('blur', onBlur);
                    opts.onStart();
                    const r = ratioOf(e.clientX);
                    if (r !== null) opts.onMove(r);
                };

                el.addEventListener('pointerdown', start);
                // 键盘操作：可访问性 + 拖不动时的保底（←↓ 退 / →↑ 进 / Shift ×10 / Home·End 到两端）
                el.addEventListener('keydown', (e) => {
                    if (!opts.usable()) return;
                    const step = e.shiftKey ? 10 : 1;
                    let d = null;
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') d = -step;
                    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') d = step;
                    else if (e.key === 'Home') d = -Infinity;
                    else if (e.key === 'End') d = Infinity;
                    else return;
                    e.preventDefault();
                    opts.onKey(d);
                });
                // 拖动时不要触发浏览器自己的元素拖拽
                el.addEventListener('dragstart', (e) => e.preventDefault());
                return st;
            }

            // ==================== 进度条：拖 / 点定位 ====================
            // 拖动过程只动本地 UI（填充、滑块、时间文本），松手才发一次 /seek，
            // 否则每一像素都是一次请求。offset 传绝对秒数。
            function renderSeekPreview(sec) {
                seekPreviewSec = sec;
                if (trackDuration > 0) {
                    seekWrapEl.style.setProperty('--p', (sec / trackDuration).toFixed(5));
                }
                if (progressCurEl) progressCurEl.textContent = fmtTime(Math.max(0, sec));
            }

            function commitSeek(sec) {
                if (!seekUsable) return;
                // 末尾留 50ms：服务端校验 offset <= duration，越界会直接 400
                const target = Math.max(0, Math.min(trackDuration - 0.05, sec));
                // 本地时钟立刻对齐 —— 歌词高亮、滚动、逐字扫光、天际屏同时到位，
                // 不用等 SSE 那 250ms，拖完那一瞬间就是准的
                clockPos = target;
                lastClockT = nowSec();
                clockTrim = 0;
                clockInit = true;
                targetProgress = target;
                currentProgress = target;
                resyncBgReveals(target);
                seekPendingUntil = performance.now() + 1500;
                ctrlFetch(ctrlSeek(target));
                // 暂停 / 停止时没有每帧循环在跑，得手动重画一次（含换行与滚动）
                if (progressRunning) updateProgressUI(target);
                else applyProgress(target);
            }

            function bindSeekBar() {
                if (!seekTrackEl || !seekWrapEl) return;
                bindSlider({
                    el: seekTrackEl,
                    usable: () => seekUsable,          // 时长未知（还没歌）时不可拖
                    onStart: () => {
                        seeking = true;
                        seekWrapEl.classList.add('seeking');
                    },
                    onMove: (r) => renderSeekPreview(r * trackDuration),
                    // 键盘没有"松手"这个动作，改一次就提交一次
                    onKey: (d) => {
                        const base = seeking ? seekPreviewSec : currentProgress;
                        const sec = d === Infinity ? trackDuration - 0.05
                                  : d === -Infinity ? 0
                                  : base + d;
                        seeking = true;
                        renderSeekPreview(Math.max(0, Math.min(trackDuration, sec)));
                        seeking = false;
                        commitSeek(seekPreviewSec);
                    },
                    onEnd: (commit) => {
                        seeking = false;
                        seekWrapEl.classList.remove('seeking');
                        if (commit) commitSeek(seekPreviewSec);
                    }
                });
            }

            function renderVolumeUI() {
                if (volRangeEl) {
                    // volumeValue 是唯一来源：填充与滑块都由 --v 驱动，不可能不同步
                    const f = Math.max(0, Math.min(1, (volumeValue - 1) / 99));
                    volRangeEl.style.setProperty('--v', f.toFixed(5));
                    volRangeEl.classList.toggle('dim', muted);
                    volRangeEl.setAttribute('aria-valuenow', String(volumeValue));
                    volRangeEl.setAttribute('aria-valuetext',
                        muted ? `${volumeValue}%（已静音）` : `${volumeValue}%`);
                }
                if (btnMuteEl) btnMuteEl.classList.toggle('muted', muted);
            }

            // 拖动 / 点击音量条：ratio(0~1) → 音量(1~100)。
            // onMove 阶段只更新本地 UI + 防抖发送；键盘或松手时 immediate=true 立刻发。
            function setVolumeFromRatio(r, immediate) {
                const v = Math.max(1, Math.min(100, 1 + Math.round(r * 99)));
                if (v !== volumeValue) {
                    volumeValue = v;
                    if (muted) muted = false;       // 动手调音量即视为解除静音
                }
                renderVolumeUI();
                if (immediate) {
                    if (volumeSendTimer) { clearTimeout(volumeSendTimer); volumeSendTimer = null; }
                    sendVolume();
                } else {
                    // 防抖 180ms：连续拖动只在停顿处发一次
                    if (volumeSendTimer) clearTimeout(volumeSendTimer);
                    volumeSendTimer = setTimeout(() => {
                        volumeSendTimer = null;
                        sendVolume();
                    }, 180);
                }
            }

            function bindVolumeBar() {
                if (!volRangeEl) return;
                bindSlider({
                    el: volRangeEl,
                    usable: () => true,
                    onStart: () => { volDragging = true; },
                    onMove: (r) => setVolumeFromRatio(r, false),
                    onKey: (d) => {
                        const v = d === Infinity ? 100 : d === -Infinity ? 1 : volumeValue + d;
                        setVolumeFromRatio((Math.max(1, Math.min(100, v)) - 1) / 99, true);
                    },
                    onEnd: () => {
                        volDragging = false;
                        if (volumeSendTimer) { clearTimeout(volumeSendTimer); volumeSendTimer = null; }
                        sendVolume();
                    }
                });
            }

            // 去重后发送：input 的防抖回调与 change 常常是同一次拖动的收尾，
            // 不去重就会把同一个音量发两遍
            function sendVolume() {
                if (volumeValue === lastSentVolume) return;
                lastSentVolume = volumeValue;
                ctrlPendingUntil = performance.now() + 900;
                ctrlFetch(ctrlVolume(volumeValue));
            }

            function toggleMute() {
                muted = !muted;
                renderVolumeUI();
                ctrlPendingUntil = performance.now() + 1200;
                ctrlFetch(ctrlMute(muted));
            }

            function renderCollectUI() {
                if (btnCollectEl) btnCollectEl.classList.toggle('on', songCollected);
            }

            function toggleCollect() {
                songCollected = !songCollected;
                renderCollectUI();
                ctrlPendingUntil = performance.now() + 1500;
                ctrlFetch(songCollected ? CTRL_COLLECT : CTRL_UNCOLLECT);
            }

            // volume / mute / collect 会由 SSE 或 /status 推来。
            // 刚点过控件的一小段时间内以本地为准，否则旧值会把 UI 拨回去再弹回来。
            function syncCtrlState(field, raw) {
                if (performance.now() < ctrlPendingUntil) return;
                const v = parseEventData(raw);
                if (field === 'volume') {
                    // 拖动中本地是权威：播放器回推的是上一拍的值，别把滑块拽回去
                    if (volDragging) return;
                    const n = parseFloat(v);
                    if (isFinite(n) && n >= 0 && n <= 100 && Math.round(n) !== volumeValue) {
                        volumeValue = Math.round(n);
                        renderVolumeUI();
                    }
                } else if (field === 'mute') {
                    const m = (String(v) === 'true');
                    if (m !== muted) { muted = m; renderVolumeUI(); }
                } else if (field === 'collect') {
                    const c = (String(v) === 'true');
                    if (c !== songCollected) { songCollected = c; renderCollectUI(); }
                }
            }

            function bindPlayerControls() {
                if (btnPlayEl) btnPlayEl.addEventListener('click', togglePlay);
                if (btnNextEl) btnNextEl.addEventListener('click', skipNext);
                if (btnPrevEl) btnPrevEl.addEventListener('click', skipPrev);
                if (btnMuteEl) btnMuteEl.addEventListener('click', toggleMute);
                if (btnCollectEl) btnCollectEl.addEventListener('click', toggleCollect);
                bindSeekBar();
                bindVolumeBar();

                setPlayingUI(playerStatus === 'playing');
                renderVolumeUI();
                renderCollectUI();
                renderStatusBadge();
            }

            // ==================== 液态玻璃：高光跟随指针 ====================
            // 只写 --mx / --my 两个自定义属性，几何换算交给 CSS 的 radial-gradient(at …)；
            // 用 rAF 节流，一帧最多一次写入（读 rect 不触发布局，因为只改了自定义属性）。
            // 离开时清掉内联值，回到 CSS 里的初始位置（50%），已注册属性还能走过渡。
            function bindGlassSheen() {
                const dock = document.getElementById('playerDock');
                if (!dock) return;
                let raf = 0, cx = 0, cy = 0;
                const apply = () => {
                    raf = 0;
                    const r = dock.getBoundingClientRect();
                    if (!r.width) return;
                    // 限制在玻璃范围内，避免指针快出边界时高光跑飞
                    const x = Math.min(Math.max(cx - r.left, 0), r.width);
                    const y = Math.min(Math.max(cy - r.top, 0), r.height);
                    dock.style.setProperty('--mx', x.toFixed(1) + 'px');
                    dock.style.setProperty('--my', y.toFixed(1) + 'px');
                };
                dock.addEventListener('pointermove', (e) => {
                    cx = e.clientX; cy = e.clientY;
                    if (!raf) raf = requestAnimationFrame(apply);
                }, { passive: true });
                const reset = () => {
                    if (raf) { cancelAnimationFrame(raf); raf = 0; }
                    dock.style.removeProperty('--mx');
                    dock.style.removeProperty('--my');
                };
                dock.addEventListener('pointerleave', reset);
                dock.addEventListener('pointercancel', reset);
            }

            // ==================== 控件变淡：指针不在控件上就淡下去 ====================
            // 判定只有一条依据：指针是否落在播放控件 / 连接状态条的矩形内。
            //   在内 → 恢复正常亮度；不在 → 降到 0.42（CSS 的 .dock-wrap.idle）。
            // 用「缓存矩形 + 比较坐标」而不是 elementFromPoint / :hover：
            //   · .conn-bar 是 pointer-events:none，:hover 在它身上永远不成立；
            //   · 比较坐标零布局开销（矩形只在 resize 与入场动画结束时重取）。
            // 拖动中（seeking / volDragging）永不淡出 —— 指针拖到轨道外不该闪一下。
            function bindDockDim() {
                if (!dockWrapEl) return;
                let dimmed = null;         // 与 class 同步的本地镜像，避免每次判定都查 DOM
                let px = NaN, py = NaN;    // 最近的指针坐标（pointermove 里更新，很便宜）
                let raf = 0;
                let ready = false;         // 入场动画跑完前不判定（理由见文末）
                let rects = [];
                const refreshRects = () => {
                    rects = [playerDockEl, connBarEl].filter(Boolean)
                        .map((el) => el.getBoundingClientRect());
                };
                const overDock = () => {
                    if (!isFinite(px)) return false;
                    for (let i = 0; i < rects.length; i++) {
                        const r = rects[i];
                        if (px >= r.left && px <= r.right && py >= r.top && py <= r.bottom) return true;
                    }
                    return false;
                };
                const apply = (d) => {
                    if (d === dimmed) return;
                    dimmed = d;
                    dockWrapEl.classList.toggle('idle', d);
                };
                // 快路径：只看坐标（每帧判定也不碰样式）
                const judgeByRect = () => apply(!overDock() && !seeking && !volDragging);
                // 慢路径：补上 :hover（页面刚加载、指针一直没动过时，
                // 坐标还是 NaN，只能靠浏览器实时的 :hover 状态才知道指针在控件上）
                const judgeFull = () => {
                    const hover = !!(playerDockEl && playerDockEl.matches(':hover'));
                    apply(!(hover || overDock()) && !seeking && !volDragging);
                };

                refreshRects();
                window.addEventListener('resize', refreshRects, { passive: true });
                window.addEventListener('pointermove', (e) => {
                    px = e.clientX; py = e.clientY;
                    if (!raf) raf = requestAnimationFrame(() => { raf = 0; judgeByRect(); });
                }, { passive: true });
                // 指针移出窗口 / 切走窗口 → 当作不在控件上
                window.addEventListener('blur', () => apply(true));
                document.addEventListener('mouseleave', () => apply(true));
                // 兜底：每 200ms 纠一次（拖动刚结束、指针没再动过、矩形刚变过，都靠它收敛）
                setInterval(() => { if (ready) judgeFull(); }, 200);
                // 入场动画（dockIn 0.9s，fill:backwards）期间 opacity 由动画占着，
                // 这时挂 .idle 不会走过渡、动画一结束会"啪"地跳到低亮度。
                // 等它跑完再开始判定，顺便在动画结束后重取一次矩形（动画里带 16px 位移）。
                setTimeout(() => {
                    refreshRects();
                    ready = true;
                    judgeFull();
                }, 1000);
            }

            // ==================== 背景图片：同目录的 backpicture.jpg ====================
            // 在 lyrics.html 所在目录放一张 backpicture.jpg 即可当整屏背景：
            //   读到了 → 淡入铺满（给图层挂 .ready），同时按 --pulse-k 减弱律动光晕；
            //   读不到（没放图 / 名字拼错 / 图片损坏）→ 什么都不做，
            //   画面维持默认的深色渐变，等价于没有这个功能。
            // 先用一个游离的 Image 探一次（onerror 能拿到"文件不存在"），
            // 再交给 CSS 图层去铺；探针与上屏是同一个 URL，浏览器只会真正读一次盘。
            function initBackPicture() {
                if (!bgPhotoEl) return;
                const PHOTO_URL = 'backpicture.jpg';
                const probe = new Image();
                probe.onload = () => {
                    bgPhotoEl.style.backgroundImage = 'url("' + PHOTO_URL + '")';
                    // 铺图+解码要花一点时间，等下一帧再淡入，免得先闪一下空白
                    requestAnimationFrame(() => {
                        bgPhotoEl.classList.add('ready');
                        lyricStageEl.classList.add('has-photo');
                        const k = parseFloat(
                            getComputedStyle(lyricStageEl).getPropertyValue('--pulse-k'));
                        bgPulseK = (isFinite(k) && k > 0) ? k : 1;
                    });
                };
                probe.onerror = () => {
                    // 保持默认背景。这里不用 error 级：没放图是合法状态，不是故障
                    console.info('[lyrics] 未找到 backpicture.jpg，沿用默认背景');
                };
                probe.src = PHOTO_URL;
            }

            function init() {
                fillEndpointInfo();
                bindPlayerControls();
                bindGlassSheen();
                bindDockDim();
                initBackPicture();
                fetchLyric(true).catch(() => {});
                fetchStatus().catch(() => {});
                initSSE();

                setInterval(() => {
                    if (lyricLines.length === 0 && playerStatus === 'playing') {
                        fetchLyric(true).catch(() => {});
                    }
                }, 8000);

                // 兜底：每 10 秒主动拉一次 status，确保封面更新
                setInterval(() => { fetchStatus().catch(() => {}); }, 10000);

                let resizeTimer = null;
                window.addEventListener('resize', () => {
                    if (resizeTimer) clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        resizeTimer = null;
                        updateListPadding();
                        updateGapWidth();   // 字号/宽度随断点变化，等待点要重新落位
                        if (currentActiveLineIndex >= 0) scrollToIndex(currentActiveLineIndex);
                        // 天际屏按新尺寸重排
                        if (bgCurrentLineIndex >= 0) {
                            const idx = bgCurrentLineIndex;
                            bgCurrentLineIndex = -1;
                            buildBackgroundArt(idx);
                        }
                    }, 150);
                });

                if (window.ResizeObserver) {
                    const ro = new ResizeObserver(() => {
                        updateListPadding();
                        if (currentActiveLineIndex >= 0) scrollToIndex(currentActiveLineIndex);
                    });
                    ro.observe(lyricScrollEl);
                }

                // 用户手动滚动时立刻结算动画/停止跟随，避免程序化位移与真实滚动叠加
                const settleOnUserScroll = () => {
                    gapFollowStop();
                    if (scrollAnim) settleScroll();
                };
                lyricScrollEl.addEventListener('wheel', settleOnUserScroll, { passive: true });
                lyricScrollEl.addEventListener('touchstart', settleOnUserScroll, { passive: true });
                lyricScrollEl.addEventListener('pointerdown', settleOnUserScroll, { passive: true });

                setTimeout(() => updateListPadding(), 100);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
