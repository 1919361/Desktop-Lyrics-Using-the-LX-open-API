<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沉浸歌词 · Any Listen 逐字 · Apple Music 抬字 · Wallpaper Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            background: #0a0a0f;
            font-family: system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .lyric-stage {
            position: fixed;
            inset: 0;
            /* height 显式钉死：inset 简写在部分旧内核（含壁纸引擎的网页宿主）不生效，
               失效时 fixed 元素高度塌缩为内容高 —— 歌词列表一长就把 stage 撑开，
               lyricScroll 失去高度上限、永不滚动，且 updateListPadding 的
               "padding = clientHeight/2" 会与 ResizeObserver 形成正反馈
               （列表变高 → 容器变高 → padding 更大 → 抖动/飞走）。
               100vh 对支持 inset 的内核无副作用（结果相同）。 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* 兜底底色：**只在线性方向上**从深蓝灰收到近黑。
               以前这里是 radial-gradient + `transition: background 2s` ——
               一圈同心圆还会在 2 秒里缓慢变形，正是"刚打开时四周一圈同心圆
               暗下来"的来源之一（另一个是 .bg-shader 的淡入，见它自己的注释）。
               现在改成线性渐变，且**不加过渡**：任何底色变化都是瞬时完成，
               不再有"看着它慢慢变"的过程。 */
            background: linear-gradient(168deg, rgba(38, 38, 66, 0.96) 0%, rgba(6, 6, 10, 0.99) 74%);
        }
        /* 背景（fBm 噪点着色器）的两个可调系数。它们都只被 JS 读取，
           所以只能通过 CSS 变量传递（工程侧用 --we-* 覆盖）。
           --bg-beat-k   ：律动强度（1 = 常规；0 = 完全不随音乐起伏）
           --bg-shader-op：整块动态背景的可见度。**有背景图时归 0** —— 照片本身
                           已有明暗层次，让位给照片（工程侧可调高，让两者叠加）。 */
        .lyric-stage { --bg-beat-k: 1; --bg-shader-op: 1; }
        .lyric-stage.has-photo { --bg-shader-op: 0; }

        /* ===== 背景图片层：同目录的 backpicture.jpg =====
           页面启动时读一次：读到了就淡入铺满整屏（挂 .ready），读不到就一直是
           opacity:0，画面维持默认的深色渐变，等价于"没有这个功能"。
           照片只当"氛围"用，所以轻微模糊 + 压暗 + 暗角 —— 不论原图多亮，
           前景的白色歌词都压得住。 */
        .bg-photo {
            position: absolute;
            inset: 0;
            /* 与 .bg-shader 同层（z-index:0）；DOM 排在它前面 → 动态背景叠在照片之上
               （有背景图时 .bg-shader 的 opacity 归 0，等于让位），照片压在默认渐变之上 */
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            filter: blur(2.5px) brightness(0.62) saturate(1.06);
            transform: scale(1.06);      /* 补掉模糊在四周留下的透明渗色边 */
            transition: opacity 1.4s ease;
        }
        .bg-photo.ready { opacity: 1; }
        /* 暗角：中间留亮、四周压深，与默认背景的收边感一致。
           两层叠：① 径向暗角负责收边；② 一层平铺的暗底负责把"整幅"都压下来 ——
           只有径向暗角时，宽屏下椭圆会被拉满整屏、中心几乎不压，
           遇到浅色照片（阳光、白衣）白字就发飘。 */
        .bg-photo::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 45%,
                    rgba(6, 8, 16, 0.08) 0%,
                    rgba(5, 6, 12, 0.44) 55%,
                    rgba(3, 4, 9, 0.80) 100%),
                rgba(4, 5, 11, 0.26);
        }

        /* ===== 背景：专辑主色 → Apple Music 式四色渐变（WebGL）=====
           整块由 WebGL 画：从专辑封面取 4 个代表色，在片元着色器里照
           applemusic-like-lyrics 的 IsolationRenderer 那套算法铺成柔和渐变
           （梯度噪声定角度 + 波浪扭曲 + lightWave 明度调制 + dither）。
           流动速度与亮度起伏由**真实低频能量**驱动（壁纸引擎的音频捕获 →
           we-glue.js 每帧写 window.__weBass；见 bgShaderDraw）。
           兜底：WebGL 不可用时不挂 .ready，一直 opacity:0，
           露出 .lyric-stage 那层主色渐变（applyBgColor 里同步写的那层）。

           **首次显形必须瞬时（不加过渡）**：这一层刚 "ready" 时如果做 1.8s
           淡入，观众看到的就是"一块带暗角的暗色从四周慢慢压上来"，
           也就是一圈同心圆似的暗影 —— 实测就是这个问题。
           所以 opacity 过渡单独放在 .fade 上，由 JS 在**首帧已经画好之后**
           的下一帧才挂上：只服务于后续（改选项/换背景图）的可见度变化。
           首帧的调色板也必须是中性色而不是黑（见状态区 bgColorBuf 的初始化）。 */
        .bg-shader {
            position: absolute;
            inset: 0;
            z-index: 0;              /* 与 .bg-photo 同层；DOM 排在照片之后 → 压在照片之上 */
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: none;
        }
        .bg-shader.fade { transition: opacity 1.2s ease; }
        .bg-shader.ready { opacity: var(--bg-shader-op, 1); }

        /* 低频调试表（默认隐藏）：排查"背景到底有没有收到音频低频"用。
           显示与否由 JS 写在 #lyricStage 的 data-bg-debug 上（工程侧有对应开关）。 */
        .bg-bass-debug {
            display: none;
            position: absolute;
            left: 16px;
            top: 16px;
            z-index: 6;
            padding: 7px 11px;
            border-radius: 10px;
            background: rgba(8, 10, 18, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #dfe8ff;
            font: 600 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: 0.02em;
            pointer-events: none;
            white-space: pre;
        }
        .lyric-stage[data-bg-debug="1"] .bg-bass-debug { display: block; }
        .bg-bass-debug i {
            display: block;
            height: 4px;
            margin-top: 5px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.14);
            overflow: hidden;
        }
        .bg-bass-debug i b {
            display: block;
            width: 0;
            height: 100%;
            background: #7fb4ff;
        }

        /* ===== 背景艺术字层 ===== */
        .bg-art-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        /* 每一句的背景字各自成批放在一个容器里：
           换句时新批可以立刻建（这样"唱到哪段才浮现哪段"的时刻才准），
           旧批在同一时间独立淡出，两者叠着交叉过渡，不再有空档/硬切 */
        .bg-batch {
            position: absolute;
            inset: 0;
        }

        .bg-char {
            position: absolute;
            font-weight: 700;
            line-height: 1;
            color: rgba(200, 220, 255, 0.5);
            will-change: transform, opacity;
            user-select: none;
            transform-origin: center center;
            filter: blur(10px);
            opacity: 0;
            /* 逐字出现只过渡 opacity/filter/scale；
               transform 交给 rAF 每帧写，两者分离才不会互相打架导致抖动。
               时长放长 + easeOutCubic：出现是一条长尾缓出，不再"啪"地弹出来 */
            scale: 0.82;
            transition: opacity 1.15s cubic-bezier(0.33, 1, 0.68, 1),
                        filter 1.15s cubic-bezier(0.33, 1, 0.68, 1),
                        scale 1.3s cubic-bezier(0.22, 1, 0.36, 1);
            white-space: nowrap;
        }
        .bg-char.revealed {
            opacity: 1;
            filter: blur(6px);
            scale: 1;
        }
        /* 旧一批字的退场：缓慢下沉虚化（ease-in） */
        .bg-batch.fade-out .bg-char {
            opacity: 0;
            filter: blur(14px);
            scale: 0.86;
            transition: opacity 0.42s cubic-bezier(0.4, 0, 0.7, 1),
                        filter 0.42s cubic-bezier(0.4, 0, 0.7, 1),
                        scale 0.46s cubic-bezier(0.4, 0, 0.7, 1);
        }

        /* 间奏期间用音符图标代替歌词（🎵 ♪ ♫ ~ …）：
           这些符号若走 .bg-char 的默认色会偏暗，单独提亮一点，
           让它们在深色背景上像"飘着的装饰音"（彩色 emoji 保持原色） */
        .bg-char.bg-note {
            color: rgba(212, 231, 255, 0.66);
            font-weight: 600;
        }

        /* ===== 底部悬浮播放控件（iOS 26 Liquid Glass）=====
           整块「悬浮」：脱离文档流、四周留白、投影离地，视觉上浮在歌词之上；
           因为不再占用布局高度，#lyricScroll 依旧拿满整屏，
           当前歌词行仍然落在屏幕几何中心，既有滚动/居中逻辑一行不用改。
           .dock-wrap 只负责定位与「连接状态贴右下角」，玻璃本体是 .player-dock。 */
        .dock-wrap {
            position: absolute;
            left: 50%;
            /* 玻璃本体距屏幕底 = --dock-lift + 状态条高 + 间隙。
               64 + 28 + 9 ≈ 101px：浮在下方留白里，不压歌词也不贴任务栏。 */
            --dock-lift: 64px;
            bottom: calc(var(--dock-lift) + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            z-index: 12;
            display: flex;
            flex-direction: column;
            align-items: flex-end;          /* 状态条靠右 = 贴玻璃右下角 */
            gap: 9px;
            width: min(1120px, calc(100vw - 48px));
            pointer-events: none;           /* 只有玻璃本体与状态条吃指针事件 */

            /* 圆角按 Apple HIG「同心圆角」成套给出：内层 = 外层 − 间距。
               改外层半径时内层自动跟随，不会出现「大圆角里塞个小圆角」的错位。
               ① .player-dock  : r-glass            （贴边）
               ② .player-bar   : r-glass − pad      （内缩 pad）
               ③ .album-art    : r-glass − pad      （内缩 pad，与 ② 同心）
               ④ 圆形/胶囊件（按钮、圆点、细轨）本就用 50% / 999px，天然对齐 */
            --r-glass: 26px;
            --pad-glass: 10px;
            --r-inner: calc(var(--r-glass) - var(--pad-glass));
        }

        /* 指针位置 → 玻璃高光的位置。
           注册成 <length-percentage> 才能把 px 值直接喂进渐变（未注册的 var 会被当成裸字符串，
           在 radial-gradient 的 at 位置上不一定合法）。 */
        @property --mx { syntax: '<length-percentage>'; inherits: true; initial-value: 50%; }
        @property --my { syntax: '<length-percentage>'; inherits: true; initial-value: 50%; }

        .player-dock {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            /* 内边距四周等距 —— 同心圆角的前提：内外层间距处处相等才算"对齐" */
            padding: var(--pad-glass);
            border-radius: var(--r-glass);
            color: #fff;
            /* ===== 真·液态玻璃（参照 iOS 26 Liquid Glass）=====
               与毛玻璃的本质区别：**中心是"透"的、边缘是"折"的**。
               ① 中心：**无 blur**（按需求整个删掉）—— 背景从玻璃里透出来是
                  清晰的，靠下面加深的底色层保住文字可读性；饱和度拉高把
                  透出来的色彩"活化"；
               ② 边缘：位移折射由 attachLiquidGlass 的 SVG 滤镜负责（行内
                  样式，悬停/idle 同一条，无切换）；::after 那圈低饱和彩虹
                  色散（screen 混合）即苹果那道彩边；
               ③ 厚度：inset 高光/暗部做出 1~2px 的"玻璃棱"，顶亮底沉。 */
            background:
                linear-gradient(180deg,
                    rgba(255, 255, 255, 0.075) 0%,
                    rgba(255, 255, 255, 0) 40%),
                linear-gradient(135deg,
                    rgba(255, 255, 255, 0.115) 0%,
                    rgba(255, 255, 255, 0.035) 42%,
                    rgba(255, 255, 255, 0.075) 100%),
                rgba(9, 11, 18, 0.36);
            backdrop-filter: saturate(1.9) brightness(1.06);
            -webkit-backdrop-filter: saturate(1.9) brightness(1.06);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.55),
                inset 0 -1px 1px rgba(255, 255, 255, 0.13),
                inset 0 0 0 1px rgba(255, 255, 255, 0.08),
                inset 0 0 34px rgba(255, 255, 255, 0.045),
                inset 0 -16px 28px -18px rgba(150, 190, 255, 0.34),
                0 20px 46px rgba(0, 0, 0, 0.42),
                0 3px 10px rgba(0, 0, 0, 0.24);
            pointer-events: auto;
            isolation: isolate;             /* 内部高光的 screen 混合只作用在玻璃内部 */
            transform: translate3d(0, 0, 0);
            /* 入场只动 transform（上滑 + 微缩放），**不动画 opacity**：
               液态玻璃折射 + 元素半透明 = 重影（见下面"变淡"的说明），
               而且运行期玻璃 opacity 恒为 1，没有任何状态需要过渡它。
               另外把拖拽相关的浏览器默认行为关掉：
               拖动进度条/音量条时不会选中文字、也不会拖出一个原生拖影 */
            animation: dockIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) backwards;
            -webkit-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        @keyframes dockIn {
            from { transform: translate3d(0, 16px, 0) scale(0.985); }
            to   { transform: translate3d(0, 0, 0) scale(1); }
        }

        /* ===== 变淡：指针不在控件上就淡下去 =====
           判定只看一件事 —— 指针是否落在播放控件 / 连接状态条内（命中就由 JS 摘掉 .dock-wrap 的 .idle）。
           ⚠ 变淡**不能**再动 .player-dock 本身的 opacity：
             液态玻璃折射（backdrop-filter: url(#svg)）+ 元素半透明时，
             未被位移的原始背景会以 (1-opacity) 透出来，和位移后的折射层
             叠成两个影子（一个字两份像）。所以玻璃元素 opacity 恒为 1，
             "变淡"拆到三层各自独立做，悬停/idle 用的是**同一套折射**，无切换：
             ① 内容（信息/进度/按钮）正常淡出 —— 主要的"退后"观感；
             ② 玻璃体内一层 .dock-dim 暗纱压暗玻璃面（纯色层，不碰滤镜）；
             ③ 边缘棱环 ::before / 彩环 ::after 淡掉 —— 棱边不再抢眼。
           快慢两头分开：淡下去 0.55s（慢，别闪），亮回来 0.3s（快，跟手）。 */
        .player-dock > :not(.dock-dim) { transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .dock-wrap.idle .player-dock > :not(.dock-dim) { opacity: 0.42; transition-duration: 0.55s; }
        .dock-wrap.idle .player-dock::before,
        .dock-wrap.idle .player-dock::after { opacity: 0.22; }
        .dock-wrap.idle .conn-bar { opacity: 0.5; transition-duration: 0.55s; }
        /* 淡下去的时候把"自主游走"的光池也停掉：看不见的东西不必继续每帧合成 */
        .dock-wrap.idle .lg-sheen .s-drift { animation-play-state: paused; }

        /* 玻璃体的"暗纱"：idle 变淡时压暗玻璃面。纯色层、无任何滤镜 ——
           它变透明只会露出"被折射过的玻璃面"，绝不会露出原始背景，无重影。 */
        .dock-dim {
            position: absolute;
            inset: 0;
            z-index: 0;                 /* 与 .lg-sheen 同层，DOM 排在其后 → 压在高光上、在内容下 */
            border-radius: inherit;
            background: #04060b;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dock-wrap.idle .dock-dim { opacity: 0.45; transition-duration: 0.55s; }

        /* 玻璃棱边：mask 抠出 1px 环再填斜向渐变 —— 光沿边缘走，而不是一圈死白 */
        .player-dock::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 3;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(140deg,
                rgba(255, 255, 255, 0.66) 0%,
                rgba(255, 255, 255, 0.10) 26%,
                rgba(255, 255, 255, 0.02) 54%,
                rgba(255, 255, 255, 0.30) 82%,
                rgba(255, 255, 255, 0.52) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ===== 彩边（色散环）=====
           只做颜色、不做滤镜：之前这圈还叠了 backdrop 提亮（饱和/对比突变），
           环内外色调一跳，就是一条明显的"折射边界"。折射已全部交给
           attachLiquidGlass 的 SVG 位移场（平滑渐入），这里只保留沿边一圈
           低饱和彩虹 + 斜向白高光，透明度压低 —— 是"棱镜边"而不是"描边"。 */
        .player-dock::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 3;
            border-radius: inherit;
            padding: 2.5px;
            background:
                conic-gradient(from 210deg at 50% 46%,
                    rgba(255, 148, 148, 0.5), rgba(255, 224, 148, 0.42),
                    rgba(148, 255, 190, 0.4), rgba(148, 214, 255, 0.46),
                    rgba(190, 148, 255, 0.42), rgba(255, 148, 218, 0.44),
                    rgba(255, 148, 148, 0.5)),
                linear-gradient(140deg,
                    rgba(255, 255, 255, 0.75) 0%,
                    rgba(255, 255, 255, 0.08) 34%,
                    rgba(255, 255, 255, 0.04) 58%,
                    rgba(255, 255, 255, 0.34) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            mix-blend-mode: screen;
            opacity: 0.42;
            pointer-events: none;
        }

        /* 液态高光：一团跟着指针走，一团自己缓慢游走。
           两团都只用 transform / 背景位置，不参与布局，也不会推动里面的文字。 */
        .lg-sheen {
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: inherit;
            overflow: hidden;
            pointer-events: none;
            mix-blend-mode: screen;
        }
        .lg-sheen i {
            position: absolute;
            left: 0;
            top: 0;
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 跟随指针的高光（--mx/--my 由 JS 每帧写入，单位 px） */
        .lg-sheen .s-follow {
            background: radial-gradient(190px 105px at var(--mx, 50%) var(--my, 50%),
                rgba(255, 255, 255, 0.30), rgba(255, 255, 255, 0) 72%);
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        .player-dock:hover .lg-sheen .s-follow { opacity: 1; }
        /* 自主游走的冷调光池：给静态画面留一点"液态"的呼吸。
           注意光池必须完全落在这一层自己的盒子里 —— 半径 26% × 透明点 70% ≈ 18%，
           而平移只有 ±11%（×scale 1.06 后 ≈ ±19%），所以整层左右平移时
           盒子边缘始终是全透明的，不会把一条硬边扫出来。 */
        .lg-sheen .s-drift {
            background: radial-gradient(26% 130% at 50% 50%,
                rgba(178, 208, 255, 0.22), rgba(178, 208, 255, 0) 70%);
            will-change: transform;
            animation: lgDrift 19s ease-in-out infinite;
        }
        @keyframes lgDrift {
            0%   { transform: translate3d(-11%, 0, 0) scale(0.94); }
            50%  { transform: translate3d(11%, 0, 0) scale(1.06); }
            100% { transform: translate3d(-11%, 0, 0) scale(0.94); }
        }
        @media (prefers-reduced-motion: reduce) {
            .lg-sheen .s-drift { animation: none; }
            .player-dock { animation: none; }
        }

        /* 封面 + 歌名 + 歌手
           （position/z-index：把内容提到 .lg-sheen 高光层之上，高光只铺在玻璃面上） */
        .pd-info {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 0 1 auto;
            min-width: 0;
            max-width: 32%;
        }

        .album-art {
            width: 52px;
            height: 52px;
            /* 与玻璃同心：26 − 10 = 16。封面是离玻璃左缘最近的圆角件，
               半径不同心时那圈弧线会明显"各转各的" */
            border-radius: var(--r-inner);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
            object-fit: cover;
            display: block;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
        }
        .album-art.visible {
            opacity: 1;
            transform: scale(1);
        }

        .track-meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .track-name {
            font-size: 0.98rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }
        .track-singer {
            font-size: 0.8rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.55);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== 进度条（可拖动定位）=====
           --p（0~1）是唯一进度来源：填充走 scaleX(var(--p))，滑块走 left:calc(var(--p)*100%)，
           两者共用一个自定义属性，每帧只写一次样式 —— 逻辑上不可能不同步，
           也不需要每帧读一次 offsetWidth（读宽度会触发同步重排）。 */
        .track-progress {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1 1 auto;
            min-width: 160px;
            --p: 0;
        }
        .track-progress-time {
            flex: 0 0 auto;
            min-width: 46px;
            font-size: 0.74rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.62);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.3px;
            white-space: nowrap;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
            transition: color 0.2s ease;
        }
        .track-progress-time.right { text-align: right; }
        .track-progress.seeking .track-progress-time { color: rgba(255, 255, 255, 0.95); }

        /* 轨道：外层 26px 是命中区，视觉上的细轨由 ::before 画，hover/拖动时变粗 */
        .track-progress-track {
            position: relative;
            flex: 1 1 auto;
            height: 26px;
            min-width: 80px;
            cursor: pointer;
            touch-action: none;
        }
        .track-progress-track::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 5px;
            margin-top: -2.5px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.18);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: height 0.18s ease, margin-top 0.18s ease, background-color 0.18s ease;
        }
        .track-progress:hover .track-progress-track::before,
        .track-progress.seeking .track-progress-track::before {
            height: 8px;
            margin-top: -4px;
            background: rgba(255, 255, 255, 0.24);
        }
        /* 填充用 scaleX 而不是 width：不触发布局，只走合成线程 */
        .track-progress-fill {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 5px;
            margin-top: -2.5px;
            border-radius: 4px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.72), #ffffff);
            transform: scaleX(var(--p, 0));
            transform-origin: 0 50%;
            will-change: transform;
            pointer-events: none;
            transition: height 0.18s ease, margin-top 0.18s ease;
        }
        .track-progress:hover .track-progress-fill,
        .track-progress.seeking .track-progress-fill {
            height: 8px;
            margin-top: -4px;
        }
        .track-progress-thumb {
            position: absolute;
            top: 50%;
            left: calc(var(--p, 0) * 100%);
            width: 11px;
            height: 11px;
            margin: -5.5px 0 0 -5.5px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, width 0.16s ease, height 0.16s ease, margin 0.16s ease;
        }
        .track-progress:hover .track-progress-thumb,
        .track-progress.seeking .track-progress-thumb { opacity: 1; }
        .track-progress.seeking .track-progress-thumb {
            width: 15px;
            height: 15px;
            margin: -7.5px 0 0 -7.5px;
        }
        /* 还没有歌曲（时长未知）时不可拖 */
        .track-progress.disabled { pointer-events: none; opacity: 0.45; }

        /* ===== 歌词滚动区域 ===== */
        .lyric-scroll {
            flex: 1;
            /* 关键：column flex 子项的 min-height 默认是 auto，会拒绝收缩到小于
               内容高度 —— 歌词列表一长就把滚动容器撑开，clientHeight 随内容变，
               而 updateListPadding 的「padding = clientHeight/2」又会把列表推得
               更高，两者经 ResizeObserver 形成正反馈（整体越推越远）。
               以前列表高度从不"连续"变化，所以一直没被引爆；翻译的展开/折叠
               让列表高度首次逐帧变化，于是表现为"切句时整体抽一下"。
               置 0 后容器高度严格 = 剩余空间，内容溢出交给 overflow 正常滚动。 */
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 6%;
            scrollbar-width: none;
            -ms-overflow-style: none;
            position: relative;
            z-index: 2;
        }
        .lyric-scroll::-webkit-scrollbar { display: none; }

        .lyric-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            /* 滚动位移由 JS 用 WAAPI 驱动 transform，保持提升可避免每次换行
               重新提升/降级图层带来的额外开销 */
            will-change: transform;
        }

        .lyric-line {
            /* 关键：inline-flex + column + align-items:flex-start。
               这样主歌词文字（.lyric-main）和翻译（.lyric-trans）都左对齐、
               共享同一个左边缘；而整行作为 inline-flex 收缩到内容宽度，
               由 .lyric-list 的 align-items:center 整体居中 ——
               既保持了「歌词居中」的原有观感，又让译文能贴着主歌词左缘排。 */
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 600;
            line-height: 1.5;
            text-align: center;
            margin: 10px 0;
            padding: 4px 16px;
            border-radius: 40px;
            max-width: 100%;
            position: relative;   /* 供翻译定位（不绝对定位了，此声明可留可去） */
            /* 注意：不要在这里写 will-change——68 行 × 每行一个图层 = 图层爆炸，
               而行/字的过渡本身会由浏览器在动画期间自动提升图层 */
            pointer-events: none;
            letter-spacing: 0.02em;
            filter: blur(7px);
            opacity: 0.28;
            transform: scale(0.94);
            transition:
                filter 1.3s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1),
                transform 1.5s cubic-bezier(0.16, 1, 0.3, 1),
                /* margin 也要过渡：带翻译的行在 active 态有 margin-top 补偿，
                   失活时若不参与过渡会瞬间跳 18px（看起来就是"切句抖一下"）。 */
                margin 0.5s cubic-bezier(0.22, 1, 0.32, 1);
        }

        /* 主歌词文字容器：只负责把逐字元素横向排开（可换行）。
           justify-content:center 让长句换行时短行仍居中 —— 保持原壁纸观感。
           整体左对齐由父级 .lyric-line 的 align-items:flex-start 决定
           （inline-flex 收缩后行宽 = 文字宽，居中与左对齐对单行无差别）。
           注意「当前句放大」的 scale 仍在行上：翻译必须与主歌词同步缩放，
           否则主歌词放大后向下/向左扩展会侵入翻译、破坏左对齐。 */
        .lyric-main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: baseline;
            max-width: 100%;
        }

        .lyric-line.active {
            filter: blur(0);
            opacity: 1;
            transform: scale(2);
            font-weight: 700;
            z-index: 3;
            transition:
                filter 1.0s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                transform 1.4s cubic-bezier(0.16, 1, 0.3, 1),
                margin 0.5s cubic-bezier(0.22, 1, 0.32, 1);
        }
        /* 带翻译的当前行：用 transform: translateY 做视觉补偿（不用 margin）。
           翻译展开撑高行的下半部 → 行缩放原点（行中心）下移 → 主歌词放大时
           向上多扩展 ~18px、贴近上一句（实测 -18px vs 原节奏 -0.3px）。
           这里把整行向下平移 18px，视觉上恰好抵消 —— 主歌词下移回原位、
           上一句恢复原节奏。
           为什么用 translate 而不是 margin-top：margin 改文档流，切句时行位置
           突变、必须靠滚动同步补偿，任何时序差都会"跳一下"（有翻译的行切句
           抖动就是这么来的）；translate 只改渲染、不动布局，过渡在合成器上
           平滑完成，滚动跟随（gapScroll 读实时 rect）自然把它算进去。
           translate 写在 scale 之前 → 位移不被 scale 放大（就是 0.51em 屏幕尺寸）。
           补偿量用 em 而不是 px：它抵消的"主歌词上扩量"与字号成正比，
           字号调到 2.2× 时 0.51em 自动变成约 40px，而写死 18px 就会偏出去。 */
        .lyric-line.has-trans.active {
            transform: translateY(0.51em) scale(2);
        }

        .lyric-line.upcoming-1 {
            filter: blur(1.8px);
            opacity: 0.72;
            transform: scale(1.0);
            transition:
                filter 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.08s,
                opacity 1.0s cubic-bezier(0.16, 1, 0.3, 1) 0.08s,
                transform 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.08s;
        }

        .lyric-line.upcoming-2 {
            filter: blur(3.2px);
            opacity: 0.55;
            transform: scale(0.98);
            transition:
                filter 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.16s,
                opacity 1.0s cubic-bezier(0.16, 1, 0.3, 1) 0.16s,
                transform 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.16s;
        }

        .lyric-line.played {
            filter: blur(8px);
            opacity: 0.26;
            transform: scale(0.93);
        }

        /* ===== 逐字：扫光 + 抬高 ===== */
        .lyric-char {
            display: inline-block;
            white-space: pre;
            --lit: 0;
            /* 扫光的亮/暗分界原来停在同一个位置（两个 stop 重合）＝一道硬边。
               现在把两个 stop 拉开成一条**渐变过渡带**：白 → 0.60 → 0.28，
               带宽 = lit×(1−lit)×6 × 带宽系数 —— 这个乘积只在 0<lit<1 时大于 0、
               在两端精确归零：lit=0（未唱）整字统一 0.28、lit=1（唱完）整字
               统一纯白，只有"正在唱的字"内部出现柔和的亮暗渐晕，
               唱过/没唱的字完全不受影响。 */
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 1) 0%,
                rgba(255, 255, 255, 1) calc(var(--lit) * 100%),
                rgba(255, 255, 255, 0.58) calc(var(--lit) * 100% + var(--lit) * (1 - var(--lit)) * 6 * 11%),
                rgba(255, 255, 255, 0.28) calc(var(--lit) * 100% + var(--lit) * (1 - var(--lit)) * 6 * 34%),
                rgba(255, 255, 255, 0.28) 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;

            /* 抬字不用 custom property 过渡，改由 JS 用 Web Animation 直接动画 transform：
               ① transform 可被合成器线程接管，不占主线程；
               ② 不会每帧重算样式 + 重绘描边光晕（这是"生硬 + 卡"的双重来源）。 */
            transform: translateY(0em) scale(1);
            transform-origin: 50% 60%;
            backface-visibility: hidden;

            /* 只有 lit 由 rAF 每帧精确设置；同样不要写 will-change：每个字一个图层会造成数百个合成层 */
            transition: filter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lyric-line.active .lyric-char {
            filter: drop-shadow(0 0 6px rgba(140, 200, 255, 0.5));
        }
        .lyric-line.active .lyric-char.singing {
            filter: drop-shadow(0 0 12px rgba(160, 210, 255, 0.85))
                    drop-shadow(0 0 24px rgba(100, 160, 255, 0.5));
        }
        .lyric-line.active .lyric-char.sung {
            filter: drop-shadow(0 0 8px rgba(140, 200, 255, 0.55));
        }

        .lyric-line:not(.active) .lyric-char {
            background-image: none;
            -webkit-text-fill-color: currentColor;
            color: white;
            --lit: 0;
            transform: none;
            transition: none;
        }

        /* ===== 翻译歌词 =====
           只显示当前正在唱的那一句的译文，贴在主歌词左下角、左边缘与主歌词对齐。
           风格与主歌词一致（同字体、同字重、同样的蓝色泛光），唯一的区别是
           **不做逐字扫光**：整句译文直接用纯白渲染，不参与 --lit 渐变。

           展开/折叠动画（播放到本句展开、结束时折叠）：
           · 外层 .lyric-trans-wrap 用 CSS Grid 的 grid-template-rows 0fr ↔ 1fr
             过渡：0fr = 高度 0（折叠、不占位），1fr = 内容自然高度（展开）。
             高度变化会让下一句被「推下让位 / 上移回位」，正好满足需求。
           · 间距用外层的 margin 过渡（margin 是布局属性、不受 active 行 scale(2)
             放大，所以展开后与下一句的间距能精确控制、不会像 padding 那样翻倍溢出）：
             折叠时 margin 全 0（行高回归原值），展开时 margin-top 小（贴主歌词）、
             margin-bottom 大（与下一句拉开）。
           · 内层 .lyric-trans 设 min-height:0 + overflow:hidden 做裁切，
             文字随 0fr→1fr 逐帧浮出。 */
        /* 展开/折叠动画（播放到本句展开、结束时折叠）：
           用 max-height 0 ↔ 目标值过渡（成熟、所有 Chromium 都支持，不像
           grid-template-rows 的 0fr↔1fr 过渡那样依赖较新的渲染引擎）。
           外层 max-height 变化 → 行高变化 → 下一句被「推下让位 / 上移回位」。
           间距用外层的 margin 过渡：折叠时 margin 全 0（行高回归原值），
           展开时 margin-top 为 0（盒子紧贴主歌词底部，字形之间的缝由
           各自的行高余量提供 —— 近但不重叠），margin-bottom 大（与下一句拉开）。 */
        .lyric-trans-wrap {
            display: block;
            /* 折叠：高度 0。展开时的高度由 JS 精确写入（= 译文内容自然高度），
               见 syncTransHeights()。 */
            max-height: 0;
            overflow: hidden;                 /* 裁切：折叠时文字被完全裁掉 */
            margin-top: 0;                    /* 折叠：无上间距 */
            margin-bottom: 0;                 /* 折叠：无下间距 */
            transition:
                max-height 0.5s cubic-bezier(0.22, 1, 0.32, 1),
                margin 0.5s cubic-bezier(0.22, 1, 0.32, 1);
        }
        .lyric-line.active .lyric-trans-wrap {
            /* 兜底值：JS 会用精确的内容高度覆盖它（见 syncTransHeights）。
               为什么必须精确 —— max-height 从 0 过渡到一个远大于内容的值时，
               高度在过渡的前几个百分点就"顶到内容"不再增长：视觉上等于
               瞬间弹开、余下大半时间僵着不动（折叠时反过来，先僵住再猛收）。
               这正是切句时"整体抽一下"的来源，所以实际值一律由 JS 精确给出。 */
            max-height: 140px;
            /* 字形紧贴主歌词：抵掉 padding-top 的占位，字形位置不变 */
            margin-top: -10px;
            /* 与下一句拉开：0.95em 里已含 padding-bottom 的 10px，这里减掉。
               （比 0.65em 大：上面 has-trans.active 把整行下移了 18px，
                 译文也跟着下移，这里补回与下一句的间距。） */
            margin-bottom: calc(0.95em - 10px);
        }

        .lyric-trans {
            /* 字号：相对 .lyric-line 的 2.2rem，译文随 active 行一起被 scale(2)
               放大，最终视觉 ≈ 0.3em × 2.2rem × 2 ≈ 1.32rem，主歌词 active 行的 1/3。 */
            font-size: 0.3em;
            font-weight: 700;                 /* 与主歌词 active 行的字重一致 */
            line-height: 1.2;
            letter-spacing: 0.02em;           /* 与主歌词一致 */
            white-space: normal;
            color: rgba(255, 255, 255, 0.85);
            /* 与主歌词 active 字同样的基础泛光（不随扫光变化） */
            filter: drop-shadow(0 0 6px rgba(140, 200, 255, 0.5));
            /* 泛光渲染空间：drop-shadow 向四周扩 6px，而外层 wrap 因折叠动画
               必须 overflow:hidden —— 没有这块内边距的话，泛光会被齐着字形
               裁断，在译文四周显出一圈矩形截边（看起来像框住译文）。
               四周 10px > 6px 模糊半径，泛光完整落在盒子内不被裁。 */
            padding: 10px;
            /* 抵消 padding 的占位：左右负 margin 保持译文与主歌词左对齐、
               盒宽不变；上下的占位由 wrap 的 margin 调整（见上）。 */
            margin: 0 -10px;
            pointer-events: none;
            background: none;
            -webkit-text-fill-color: currentColor;
            -webkit-background-clip: initial;
            background-clip: initial;
        }

        /* ===== 间奏等待点（· · ·）=====
           ① 平时完全不出现、且不占位置：等待点行高度就是 0，
              所以它上下的两句歌词是「紧挨着」的（不是留一个空洞）。
           ② 进入等待区间时才展开：上下两句歌词平滑地让开，三个点
              在让开的空隙里浮现；等待一结束就重新合拢、随之隐藏。
           ③ 靠"歌词的左边界"，而不是容器（≈屏幕）的左边界：行宽由
              --gap-w 给（JS 量出最长歌词行的宽度算出来的），行居中排布，
              三个点再靠这条盒子的左缘 —— 大屏上歌词是居中的，
              贴容器左缘会离歌词十万八千里。
              从左侧长大（transform-origin: 0 50%），缩放不会把左半推出去。
           ④ 三个点「一个接一个」点亮 —— 离散切换，不做圆点内部的扫光。
           ⑤ 等待期间三个点作为一个整体一起呼吸：幅度小、周期长（参考
              Apple Music 的间奏省略号，是"若有若无的心跳"，不是跳动）。

           展开/合拢的做法：外层直接过渡 height 0 ↔ 0.95em（纯长度，插值
           在所有浏览器上都成立），内层 height:100% + overflow:hidden 负责裁切。
           两个坑：
             - 裁切层不能有垂直 padding。它会把外层压不到 0（垂直内边距
               不可压缩，会撑住 min-content），折叠后残留几十像素。
               所以"呼吸余量"改用外层的 0.95em 高度给，而不是内边距。
             - 内层必须 height:100% 跟着外层高度走，才能逐帧裁切。 */
        .lyric-line.gap-line {
            display: block;
            height: 0;                               /* 折叠：不占高度 */
            /* 居中 + 由 --gap-w 决定的宽度 —— 这样"盒子的左缘"就落在
               歌词块的左边界附近，而不是容器的左边缘（大屏上二者能差几百 px）。
               --gap-w 由 JS 量出（updateGapWidth），未量到时的兜底见下。 */
            align-self: center;
            width: var(--gap-w, min(72vw, 100%));
            margin: 0;
            padding: 0;
            letter-spacing: 0;
            transform-origin: 0 50%;

            /* 折叠态：透明 + 模糊 + 略缩，展开时反向回正 */
            opacity: 0;
            visibility: hidden;
            filter: blur(5px);
            transform: scale(1.45);
            transition:
                height 0.62s cubic-bezier(0.22, 1, 0.32, 1),
                margin 0.62s cubic-bezier(0.22, 1, 0.32, 1),
                opacity 0.44s ease,
                filter 0.44s ease,
                transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                visibility 0s linear 0.5s;
        }
        .lyric-line.gap-line.open {
            height: 0.95em;                          /* 展开：让出空隙（em 随字号缩放） */
            margin: 12px 0;
            opacity: 1;
            visibility: visible;
            filter: blur(0);
            transform: scale(1.55);
            transition:
                height 0.62s cubic-bezier(0.22, 1, 0.32, 1),
                margin 0.62s cubic-bezier(0.22, 1, 0.32, 1),
                opacity 0.44s ease,
                filter 0.44s ease,
                transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                visibility 0s linear 0s;
        }

        /* 裁切层：高度跟着外层走，0 高时三个点被完全裁掉。
           注意这里不能加垂直 padding（见上）。 */
        .gap-inner {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0.26em;                            /* 与圆点直径按比例收，保持"一个紧凑省略号"的观感 */
            height: 100%;
            min-height: 0;
            overflow: hidden;
            /* 横向留出呼吸放大的余量。注意这里只有横向 padding —— 纵向
               内边距不可压缩，会把折叠态撑住（见上）。 */
            padding: 0 18px;
            /* 呼吸的缩放锚点 = 「三个点这个小团」的水平中心，而不是左缘。
               锚在左缘时：最左那个点钉死不动、整团向右顶出去，看着像被
               从左边拽着长，很别扭；锚在团心则是左右对称地一起鼓起来。
               团宽 = 3 × 0.3em + 2 × 0.26em = 1.42em，半宽 0.71em；
               再加左内边距 18px 得到团心。用 em/calc 写，字号换挡时自动跟着走。
               （注意不能写成 50%：那是这行 579px 宽盒子的中心，
                 而三个点是靠左放的，绕盒子中心缩放会让整团左右平移几十像素。） */
            transform-origin: calc(18px + 0.71em) 50%;
        }

        .gap-dot {
            display: block;
            flex: 0 0 auto;
            width: 0.3em;
            height: 0.3em;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.26);
            /* 不加光晕：三个点挨得近，各自的阴影会在外面叠成一圈雾，
               把整组包起来（看着像发光的胶囊）。纯色圆点更干净。 */
            box-shadow: none;
            transition: background-color 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
        }
        /* 一次点亮一个点：整颗圆点由暗转亮，而不是内部扫过去。
           点亮态也只留一丝极弱的辉光（半径 5px / 透明度 0.18）——
           在暗底上让"亮起来的点"像在发光，而不是死白一片。 */
        .gap-dot.lit {
            background-color: rgba(255, 255, 255, 0.98);
            box-shadow: 0 0 5px rgba(150, 200, 255, 0.18);
        }

        /* 呼吸：三个点作为「一个整体」一起起伏（不再各点错相位）。
           动画加在裁切层上 → 三个点连同间距一起缩放，是同一个心跳；
           加在单个点上就会各自缩放、还被各自的 transition 干扰。
           幅度/周期参考 Apple Music 的间奏点：1 → 1.12、3.6s 一个来回，
           是"很轻的一口气"，不是弹跳。 */
        @keyframes gapBreath {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.12); }
        }
        .lyric-line.gap-line.open .gap-inner {
            animation: gapBreath 3.6s ease-in-out infinite;
        }

        @supports not (background-clip: text) {
            .lyric-char {
                background-image: none;
                -webkit-text-fill-color: currentColor;
                color: white;
            }
        }

        @property --lit {
            syntax: '<number>';
            inherits: false;
            initial-value: 0;
        }

        /* ===== 连接状态：悬浮在播放控件右下角 =====
           一块同一材质的小玻璃胶囊，右缘与控件右缘对齐、贴在它下沿。
           横向排布「连接 / 播放器 / IP / 端口 / 协议」，窄屏逐级收起次要字段。
           pointer-events: none —— 它只是信息，不该吃掉任何交互。 */
        .conn-bar {
            position: relative;
            z-index: 1;
            flex: 0 0 auto;
            max-width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 0.72rem;
            line-height: 1;
            letter-spacing: 0.3px;
            color: rgba(255, 255, 255, 0.5);
            background: linear-gradient(135deg,
                rgba(255, 255, 255, 0.11) 0%,
                rgba(255, 255, 255, 0.045) 100%);
            backdrop-filter: blur(16px) saturate(1.6) brightness(1.06);
            -webkit-backdrop-filter: blur(16px) saturate(1.6) brightness(1.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                0 10px 24px rgba(0, 0, 0, 0.34);
            pointer-events: none;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            /* 同 .player-dock：用 backwards 让动画结束后交出 opacity 的控制权，
               「不在控件上就变淡」才能生效 */
            animation: dockIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) backwards;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cb-item {
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }
        .cb-k { color: rgba(255, 255, 255, 0.28); }
        .cb-v { color: rgba(255, 255, 255, 0.66); }
        .cb-sep {
            flex: 0 0 auto;
            width: 1px;
            height: 12px;
            background: rgba(255, 255, 255, 0.12);
        }
        /* 版权/来源：比状态信息更弱一档，读起来像脚注而不是状态 */
        .cb-tail {
            margin-left: auto;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.94em;
            letter-spacing: 0.4px;
        }
        .sb-dot {
            flex: 0 0 auto;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
        }
        .sb-dot.ok { background: #4ade80; box-shadow: 0 0 8px rgba(74, 222, 128, 0.7); }
        .sb-dot.err { background: #f87171; box-shadow: 0 0 8px rgba(248, 113, 113, 0.7); }
        .sb-dot.connecting { background: #fbbf24; animation: sbPulse 1.3s ease-in-out infinite; }
        @keyframes sbPulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.22; }
        }

        /* ===== 播放控件（嵌在玻璃胶囊右段）=====
           收藏 / 上一曲 / 播放暂停 / 下一曲 / 音量。
           自己再套一层极淡的内层玻璃：液态玻璃常见的"玻璃里还有玻璃"，
           层次感比一整块平板更强。图标统一用描边 SVG（不依赖字体符号）。 */
        .player-bar {
            position: relative;
            z-index: 1;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 9px;
            /* 内层玻璃与外层玻璃同心：26 − 10 = 16 */
            border-radius: var(--r-inner);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
        }
        .pb-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.12s ease;
        }
        .pb-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .pb-btn:active { transform: scale(0.9); }
        .pb-btn svg {
            display: block;
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* 播放/暂停：白底圆钮，最醒目 */
        .pb-main {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.94);
            color: #101010;
        }
        .pb-main:hover { background: #fff; color: #000; }
        .pb-main svg { width: 20px; height: 20px; stroke-width: 2.1; }
        /* 播放/暂停两枚图标常驻 DOM，只切显隐（避免每次点击重建节点） */
        .pb-main .ic-pause { display: none; }
        .player-bar.playing .pb-main .ic-play { display: none; }
        .player-bar.playing .pb-main .ic-pause { display: block; }
        /* 音量图标同理：静音时换成带叉的 */
        .pb-vol-icon .ic-vol-mute { display: none; }
        .pb-vol-icon.muted .ic-vol-on { display: none; }
        .pb-vol-icon.muted .ic-vol-mute { display: block; }
        /* 已收藏：实心红心 */
        .pb-btn.on { color: #ff6b8b; }
        .pb-btn.on svg { fill: currentColor; }
        .pb-btn.muted { color: rgba(255, 255, 255, 0.38); }

        .pb-volume {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-left: 2px;
            padding-left: 9px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* 音量条：与进度条同一套零件（细轨 + 圆形滑块 + --v 驱动），
           视觉语言统一。关键是命中区做到 22px 高 —— 原生 range 只有 4px 高，
           想在这么一条线上"抓住"它拖动基本不可能，只能点一下让数值跳过去。 */
        .pb-range {
            position: relative;
            flex: 0 0 auto;
            width: 84px;
            height: 22px;
            cursor: pointer;
            touch-action: none;
            --v: 1;                     /* 0~1，唯一音量来源（填充与滑块共用） */
            transition: opacity 0.2s ease;
        }
        .pb-range::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 4px;
            margin-top: -2px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.2);
            transition: height 0.18s ease, margin-top 0.18s ease;
        }
        .pb-range:hover::before,
        .pb-range.dragging::before { height: 6px; margin-top: -3px; }
        .pb-range-fill {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 4px;
            margin-top: -2px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.72), #ffffff);
            transform: scaleX(var(--v, 1));
            transform-origin: 0 50%;
            will-change: transform;
            pointer-events: none;
            transition: height 0.18s ease, margin-top 0.18s ease;
        }
        .pb-range:hover .pb-range-fill,
        .pb-range.dragging .pb-range-fill { height: 6px; margin-top: -3px; }
        .pb-range-thumb {
            position: absolute;
            top: 50%;
            left: calc(var(--v, 1) * 100%);
            width: 11px;
            height: 11px;
            margin: -5.5px 0 0 -5.5px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
        }
        .pb-range:hover .pb-range-thumb,
        .pb-range.dragging .pb-range-thumb,
        .pb-range:focus-visible .pb-range-thumb { opacity: 1; }
        /* 静音：整条转成低对比，而不是把命中区一起藏掉 */
        .pb-range.dim::before { background: rgba(255, 255, 255, 0.1); }
        .pb-range.dim .pb-range-fill { background: rgba(255, 255, 255, 0.34); }
        .pb-range.dim .pb-range-thumb { background: rgba(255, 255, 255, 0.5); }
        .pb-range:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.55);
            outline-offset: 4px;
            border-radius: 6px;
        }

        .empty-lyric {
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.4rem;
            filter: blur(0.5px);
            text-align: center;
            padding: 40px 0;
        }

        /* 中等宽度起：进度条独占第二行 —— 封面/曲目与控件共处第一行，
           这样窄窗口下进度条也不会被挤成一小截（拖动距离够长才好定位）；
           同时让出状态条上的次要字段。玻璃换回大圆角矩形（两行内容用胶囊会很怪）。 */
        /* 中窄窗口：整条状态胶囊快贴到玻璃宽度上限了，先把最长的"来源"那句收起 */
        @media (max-width: 1040px) {
            .cb-tail { display: none; }
        }

        @media (max-width: 900px) {
            /* 只改变量：内层圆角会跟着 --r-glass 自动重算，始终同心 */
            .dock-wrap { width: calc(100vw - 32px); --dock-lift: 52px; --r-glass: 26px; --pad-glass: 12px; }
            .player-dock { flex-wrap: wrap; gap: 8px 14px; }
            .pd-info { flex: 1 1 auto; max-width: none; }
            .track-progress { order: 3; flex: 1 1 100%; min-width: 0; }
            .conn-bar { gap: 10px; padding: 6px 11px; }
            .cb-item.opt, .cb-sep.opt { display: none; }
        }

        @media (max-width: 600px) {
            .lyric-line { font-size: 1.5rem; }
            .lyric-scroll { padding: 0 5%; }
            .dock-wrap { width: calc(100vw - 20px); --dock-lift: 44px; --r-glass: 20px; --pad-glass: 9px; gap: 7px; }
            .player-dock { gap: 6px 10px; }
            .pd-info { gap: 10px; }
            .album-art { width: 40px; height: 40px; }
            .track-name { font-size: 0.84rem; }
            .track-singer { font-size: 0.72rem; }
            .track-progress { gap: 8px; }
            .track-progress-time { min-width: 40px; font-size: 0.68rem; }
            .player-bar { gap: 3px; padding: 3px 5px; }
            .pb-btn { width: 32px; height: 32px; }
            .pb-btn svg { width: 17px; height: 17px; }
            .pb-main { width: 38px; height: 38px; }
            .pb-volume { gap: 5px; padding-left: 7px; }
            .pb-range { width: 52px; }
            /* 极窄：状态条只留「连接 + IP」 */
            .conn-bar { font-size: 0.64rem; gap: 8px; padding: 5px 9px; }
            .cb-item.opt2, .cb-sep.opt2, .cb-tail { display: none; }
        }
    </style>
    <!-- ==== WE-INJECT-START ==== -->
    <!-- 壁纸引擎选项层：由 build.js 自动注入，重跑 build.js 会覆盖本段 -->

    <script src="we-glue.js"></script>

<body>
    <div class="lyric-stage" id="lyricStage">
        <!-- 背景图片层：只有同目录存在 backpicture.jpg 时才会淡入（见 initBackPicture） -->
        <div class="bg-photo" id="bgPhoto" aria-hidden="true"></div>
        <!-- 动态背景：专辑主色 → Apple Music 式四色渐变（WebGL）。见 bgShaderInit -->
        <canvas class="bg-shader" id="bgShader" aria-hidden="true"></canvas>
        <!-- 低频调试表（默认不显示）：看一眼就知道背景收到的低频是多少、
             以及"到底有没有音频捕获"。排查用，见 bgShaderDraw 里的更新 -->
        <div class="bg-bass-debug" id="bgBassDebug" aria-hidden="true">
            <span id="bgBassDebugText">低频 --</span>
            <i><b id="bgBassDebugBar"></b></i>
        </div>
        <div class="bg-art-layer" id="bgArtLayer"></div>
        <div class="lyric-scroll" id="lyricScroll">
            <div class="lyric-list" id="lyricList">
                <div class="empty-lyric">等待播放…</div>
            </div>
        </div>

        <!-- 底部悬浮播放控件（iOS 26 Liquid Glass）
             —— 曲目信息 + 可拖动进度条 + 播放控件同处一块玻璃，
             绝对定位悬浮，不占布局高度。 -->
        <div class="dock-wrap" id="dockWrap">
        <div class="player-dock" id="playerDock">
            <!-- 液态高光层：跟随指针的一团 + 自主游走的一团（纯装饰） -->
            <div class="lg-sheen" aria-hidden="true">
                <i class="s-drift"></i>
                <i class="s-follow"></i>
            </div>
            <!-- idle 变淡的"暗纱"：压暗玻璃面用。纯色层、无滤镜 ——
                 它变透明只会露出"被折射过的玻璃面"，绝不露出原始背景（无重影） -->
            <div class="dock-dim" aria-hidden="true"></div>
            <div class="pd-info" id="trackInfo">
                <img class="album-art" id="albumArt" alt="" crossorigin="anonymous" />
                <div class="track-meta">
                    <span class="track-name" id="trackName">—</span>
                    <span class="track-singer" id="trackSinger">—</span>
                </div>
            </div>
            <!-- 进度条：点/拖轨道即定位；--p 是唯一的进度来源（填充与滑块共用） -->
            <div class="track-progress disabled" id="seekWrap">
                <span class="track-progress-time" id="progressCur">0:00</span>
                <div class="track-progress-track" id="seekTrack" role="slider" aria-label="播放进度"
                     aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="-1">
                    <div class="track-progress-fill" id="progressFill"></div>
                    <div class="track-progress-thumb" id="seekThumb"></div>
                </div>
                <span class="track-progress-time right" id="progressDur">0:00</span>
            </div>
            <div class="player-bar" id="playerBar">
            <button class="pb-btn" id="btnCollect" title="收藏" aria-label="收藏">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
            <button class="pb-btn" id="btnPrev" title="上一曲" aria-label="上一曲">
                <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
            </button>

    <script>
        (function() {
            const API_BASE = 'http://127.0.0.1:23330';
            // 注意：/status 与 SSE 订阅的默认 filter 不含 picUrl / collect / volume / mute，
            // 必须显式指定，否则拿不到封面、收藏态和音量
            const SSE_FILTER = encodeURIComponent('status,name,singer,albumName,picUrl,progress,duration,playbackRate,collect,volume,mute');
            const SSE_URL = `${API_BASE}/subscribe-player-status?filter=${SSE_FILTER}`;
            const LYRIC_ALL_URL = `${API_BASE}/lyric-all`;
            const STATUS_URL = `${API_BASE}/status?filter=${encodeURIComponent('status,name,singer,albumName,duration,progress,picUrl,playbackRate,collect,volume,mute')}`;

            // 播放控制接口（见 api.txt，均为 GET）
            const CTRL_PLAY = `${API_BASE}/play`;
            const CTRL_PAUSE = `${API_BASE}/pause`;
            const CTRL_NEXT = `${API_BASE}/skip-next`;
            const CTRL_PREV = `${API_BASE}/skip-prev`;
            const ctrlVolume = (v) => `${API_BASE}/volume?volume=${Math.round(v)}`;
            const ctrlMute = (m) => `${API_BASE}/mute?mute=${m ? 'true' : 'false'}`;
            // /seek 的 offset 是「绝对秒数」（源码校验 0 <= offset <= duration，越界返回 400），
            // 不是增量；进度条拖动算出的就是这个位置
            const ctrlSeek = (sec) => `${API_BASE}/seek?offset=${sec.toFixed(3)}`;
            const CTRL_COLLECT = `${API_BASE}/collect`;
            const CTRL_UNCOLLECT = `${API_BASE}/uncollect`;

            const BG_ANTICIPATE = 0.25;

            // SSE 的 data 字段是 JSON 编码的字符串（如 data: "playing"），
            // EventSource 不会自动解码，需要去掉引号；裸值则原样返回
            function parseEventData(raw) {
                if (typeof raw !== 'string') return raw;
                const trimmed = raw.trim();
                if (trimmed.length >= 2 &&
                    ((trimmed.startsWith('"') && trimmed.endsWith('"')) ||
                     (trimmed.startsWith("'") && trimmed.endsWith("'")))) {
                    return trimmed.slice(1, -1);
                }
                return trimmed;
            }

            const lyricStageEl = document.getElementById('lyricStage');
            const bgShaderEl = document.getElementById('bgShader');
            const bgBassDebugEl = document.getElementById('bgBassDebug');
            const bgBassDebugTextEl = document.getElementById('bgBassDebugText');
            const bgBassDebugBarEl = document.getElementById('bgBassDebugBar');
            const bgPhotoEl = document.getElementById('bgPhoto');
            const lyricListEl = document.getElementById('lyricList');
            const lyricScrollEl = document.getElementById('lyricScroll');
            const trackNameEl = document.getElementById('trackName');
            const trackSingerEl = document.getElementById('trackSinger');
            const albumArtEl = document.getElementById('albumArt');
            const bgArtLayerEl = document.getElementById('bgArtLayer');
            const progressFillEl = document.getElementById('progressFill');
            const progressCurEl = document.getElementById('progressCur');
            const progressDurEl = document.getElementById('progressDur');
            const seekWrapEl = document.getElementById('seekWrap');
            const seekTrackEl = document.getElementById('seekTrack');
            const playerBarEl = document.getElementById('playerBar');
            const btnPlayEl = document.getElementById('btnPlay');
            const btnPrevEl = document.getElementById('btnPrev');
            const btnNextEl = document.getElementById('btnNext');
            const btnMuteEl = document.getElementById('btnMute');
            const btnCollectEl = document.getElementById('btnCollect');
            const volRangeEl = document.getElementById('volRange');
            const volFillEl = document.getElementById('volFill');
            const volThumbEl = document.getElementById('volThumb');
            const dockWrapEl = document.getElementById('dockWrap');
            const playerDockEl = document.getElementById('playerDock');
            const connBarEl = document.getElementById('connBar');
            const sbDotEl = document.getElementById('sbDot');
            const sbStateEl = document.getElementById('sbState');
            const sbIpEl = document.getElementById('sbIp');
            const sbPortEl = document.getElementById('sbPort');
            const cbPlayerEl = document.getElementById('cbPlayer');

            let lyricLines = [];
            let lyricLineElements = [];
            let lyricCharElements = [];
            // 间奏等待点所在的行号（换行时用来把所有"不该展开"的等待点合拢）
            let gapLineIndices = [];

            let currentActiveLineIndex = -1;

            // 逐字状态缓存：避免每帧重复写 DOM（-1 未初始化 0 未唱 1 正在唱 2 已唱）
            let charState = [];
            let charLit = [];

            let playerStatus = 'stoped';

            // ---- 底部连接状态条 ----
            let connState = 'connecting';      // connecting | ok | error
            let connText = '连接中…';

            // ---- 进度条：拖动定位 ----
            let seeking = false;               // 正在拖动
            let seekPreviewSec = 0;            // 拖动中的预览位置（秒）
            let seekUsable = false;            // 时长已知才允许拖动
            let seekPendingUntil = 0;          // 刚 seek 过：这段时间内忽略权威进度，防止旧值先到把进度条拨回去

            // ---- 播放控件本地态（SSE / /status 会持续校正；点击时先乐观更新） ----
            let songCollected = false;
            let volumeValue = 100;
            let muted = false;
            let volumeSendTimer = null;
            let volDragging = false;
            let lastSentVolume = -1;           // 已发过的音量（去重，避免同一次拖动发两遍）
            let ctrlPendingUntil = 0;          // 刚点过控件的一小段时间内，不让旧状态把 UI 拨回去
            // targetProgress 最近一次权威进度（来自 SSE / status）；currentProgress 是本地时钟的每帧推算值
            let targetProgress = 0;
            let currentProgress = 0;
            let progressRafId = null;
            let progressRunning = false;

            // ---- 本地播放时钟 ----
            // 为什么不用「把 currentProgress 往 targetProgress 逼近」？
            // SSE 每 ~250ms 才推一次进度，逼近式平滑会让逐帧推进量变成
            // 0,0,0,…,0,16x,7x,4x,… 的脉冲（实测 p50 = 0），扫光看起来就是一顿一顿。
            // 改为：以本地时钟按 playbackRate 连续推进，权威进度只用来「吸收误差」，
            // 于是逐帧推进量恒定 ≈ 1.0，扫光/律动真正连续。
            const CLOCK_HARD_ERR = 0.35;   // 误差超过此值 → 视为拖动/切歌，直接对齐
            const CLOCK_TRIM_TAU = 0.45;   // 速度微调的回零时间常数（秒）
            const CLOCK_TRIM_CAP = 0.35;   // 速度微调上限（±35%）
            let clockPos = 0;              // 本地时钟推算出的当前进度（秒）——由积分推进
            let clockRate = 1;             // 播放速率
            let clockTrim = 0;             // 速度微调（吸收误差用；位置是它的积分，所以不会有跳变）
            let clockRunning = false;      // 时钟是否在走（暂停/停止时冻结）
            let clockInit = false;         // 是否已收到过权威进度（避免用陈旧锚点起跑）
            let lastClockT = 0;

            let currentSongName = '';
            let currentSinger = '';
            let currentPicUrl = '';
            let lastFetchSongKey = '';
            let fetchTimer = null;

            let bgChars = [];
            let bgAnimationId = null;
            let bgStartTime = 0;
            let bgCurrentLineIndex = -1;
            let bgFloat = [];          // 漂移参数缓存（避免每帧读 dataset）
            let bgRevealPtr = 0;       // 逐字出现指针（字符按时间递增，O(1) 推进）
            let bgBuildToken = 0;      // 构建代次，作废在途的异步重建
            let bgBuildTimer = null;

            let statusFetchTimer = null;

            let scrollAnim = null;          // WAAPI 动画对象（位移由合成器线程推进）
            let scrollLastInterrupt = -1e9; // 上一次滑动被"没跑完就打断"的时刻（快歌词检测）

            // 行 class 缓存，避免每次换行重写全部 68 行（0 无 1 played 2 active 3 up1 4 up2）
            let lineClassCache = [];
            const LINE_CLASS = [null, 'played', 'active', 'upcoming-1', 'upcoming-2'];

            // ---- 背景着色器（WebGL）----
            // 算法参考 applemusic-like-lyrics 的 IsolationRenderer：
            // 4 色调色板 + 梯度噪声定角度 + 波浪扭曲 + lightWave 明度调制 + dither。
            let bgGl = null, bgProg = null, bgQuad = null;
            let bgUni = {};                      // 各 uniform 的 location
            let bgShaderRafId = null;
            let bgShaderResizeTimer = null;
            let bgShaderLast = 0;
            let bgFlowTime = 0;                  // 着色器用的累积时间（由低频调制快慢）
            let bgShaderRun = false;             // 是否已成功初始化并开始绘制
            let bgShaderK = 1;                   // 律动强度系数（CSS --bg-beat-k，工程侧可覆盖）
            let bgBass = 0;                      // 平滑后的低频能量（0~1）—— 音频包络，只给调试表
            let bgSwell = 0;                     // 慢驱动（τ≈0.9/1.7s）：只给速度与整体明度
            let bgPulse = 0;                     // 中速驱动（τ≈0.11/0.30s）：承担"律动"的可见部分（空间呼吸）
            let bgHasBassSource = false;         // 是否真的有音频捕获（壁纸引擎才有）
            let bgStyleId = 0;                   // 律动风格（0呼吸 1明暗 2涟漪 3倾斜 4进退），换封面时随机
            let bgPalette = null;                // 最近一次 4 色调色板（着色器就绪前先存着）
            /* 整帧常量：这些参数含随机量，必须"每次换封面只掷一次" ——
               逐帧重算会让画面逐帧剧烈跳变（参考实现也是这么处理的）。 */
            const bgRandom = new Float32Array(3);
            const bgFlow = new Float32Array(4);   // 波纹频率 / 幅度除数 / 流速(带方向) / 渐变轴倾角
            const bgColorBuf = new Float32Array(12);   // 当前上传给着色器的调色板（OkLab，逐帧向目标 lerp）
            let bgColorTgt = new Float32Array(12);     // 目标调色板（切歌时更新，颜色渐变过渡的终点）
            let bgPaletteHasTgt = false;               // 是否已有目标（首帧从黑渐入也算过渡的一部分）
            const bgPaletteOrder = new Uint8Array([0, 1, 2, 3]);
            let bgAngleJitter = 0;
            /* 亮度映射：一次线性缩放 + **双侧限幅**。
               L 是"感知亮度"，回到相对亮度大致按 L³ —— 所以
               0.52 → 0.66（×1.27）约等于相对亮度 ×2.0、屏幕上的观感亮度 ×1.6。
               但只乘一个固定系数是不够的：封面的明暗差异很大，
               实测遇到过一张很亮的封面，乘完均值冲到 108、白字对比度掉到 2.9:1
               （低于大字号 3:1 门槛）；而深色封面乘完还是偏暗。
               所以再夹一层：暗部抬到地板、亮部压到天花板 —— 不管封面多亮多暗，
               背景的明度都落在同一个可控区间里。
                 · BG_L_FLOOR 0.30：暗部地板，深色封面不至于糊成一团；
                 · BG_L_CEIL  0.54：亮部天花板，由白字对比度定（离线用同一套
                   OkLab 公式算过，见 .workbuddy/check-gamut.js：L=0.54 时
                   对白字约 4.9:1）。
               试过再加一条"抬暗部"的 γ 曲线能再亮约 18%，但饱和封面的最差对比度
               会掉到 2.9:1，得不偿失，所以不加 —— 白字可读性是底线。
               也试过加彩度（a/b ×1.15）：对真实封面几乎无效（k-means 出来的 4 色
               本身就接近灰，彩度只有 0.02~0.04），却让饱和封面更容易被推出 sRGB
               色域（出界后被 clamp，反而发白），所以不加。 */
            const BG_DARKEN = 0.66;
            const BG_L_FLOOR = 0.30;
            const BG_L_CEIL = 0.54;
            function bgLightness(L) {
                return Math.min(BG_L_CEIL, Math.max(BG_L_FLOOR, L * BG_DARKEN));
            }
            let bgBassDebugTick = 0;             // 调试表节流（每 6 帧刷一次就够看）

            /* 首帧调色板绝不能"什么都没设"：Float32Array 默认全 0，
               那意味着着色器头几帧画的是一块**纯黑 + 暗角**的画面。
               它再淡入上来，肉眼看到的就是"四周一圈同心圆慢慢暗下来"。
               先填一组中性深蓝灰（与 .lyric-stage 兜底底色同调），
               等封面调色板到了再被覆盖 —— 这样任何时刻画面都是有颜色的。 */
            (function () {
                const c = srgbToOklab(46, 50, 78);
                for (let i = 0; i < 4; i++) {
                    bgColorBuf[i * 3] = bgLightness(c[0]);
                    bgColorBuf[i * 3 + 1] = c[1];
                    bgColorBuf[i * 3 + 2] = c[2];
                }
            })();

            // ==================== 进度条 ====================
            // 时间来源与扫光共用同一条本地时钟（currentProgress），因此进度条、
            // 逐字扫光、等待点三者永远同步，不会出现"条走了字没走"的割裂感。
            let trackDuration = 0;    // 歌曲总时长（秒）
            let shownSec = -1;        // 已渲染的秒数：只在整数秒变化时改文本，避免每帧重排
            let shownDur = -1;

            function fmtTime(sec) {
                sec = Math.max(0, Math.floor(sec));
                const h = Math.floor(sec / 3600);
                const m = Math.floor((sec % 3600) / 60);
                const s = sec % 60;
                if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                return `${m}:${String(s).padStart(2, '0')}`;
            }

            function updateProgressUI(progress) {
                if (!seekWrapEl) return;
                // 拖动期间进度条由预览接管，别让每帧的本地时钟把它拽回去
                if (seeking) return;

                const usable = trackDuration > 0;
                if (usable !== seekUsable) {
                    seekUsable = usable;
                    seekWrapEl.classList.toggle('disabled', !usable);
                }
                // --p（0~1）同时驱动填充与滑块，两者不可能不同步
                const f = usable ? Math.max(0, Math.min(1, progress / trackDuration)) : 0;
                seekWrapEl.style.setProperty('--p', f.toFixed(5));

                const sec = Math.floor(Math.max(0, progress));
                const dur = Math.round(trackDuration);
                if (sec !== shownSec || dur !== shownDur) {
                    shownSec = sec;
                    shownDur = dur;
                    const durText = dur > 0 ? fmtTime(dur) : '0:00';
                    if (progressCurEl) progressCurEl.textContent = fmtTime(sec);
                    if (progressDurEl) progressDurEl.textContent = durText;
                    if (seekTrackEl) {
                        seekTrackEl.setAttribute('aria-valuemax', String(dur));
                        seekTrackEl.setAttribute('aria-valuenow', String(sec));
                        seekTrackEl.setAttribute('aria-valuetext', `${fmtTime(sec)} / ${durText}`);
                    }
                }
            }

            // ==================== 本地播放时钟 ====================
            function nowSec() { return performance.now() / 1000; }

            function setClockRate(r) {
                if (typeof r === 'number' && isFinite(r) && r > 0) clockRate = r;
            }

            // 推进并返回当前进度。
            // 位置由「速度积分」得到：速度微调 clockTrim 只影响斜率，
            // 因此吸收误差时不会出现位置阶跃（这正是 4Hz 微抖的来源）。
            function clockProgress(now) {
                if (!clockRunning) return clockPos;
                let dt = now - lastClockT;
                if (!(dt > 0)) { lastClockT = now; return clockPos; }
                if (dt > 0.5) dt = 0.5;              // 标签页被挂起后回来，别一次跳太远
                clockTrim *= Math.exp(-dt / CLOCK_TRIM_TAU);
                if (Math.abs(clockTrim) < 1e-4) clockTrim = 0;
                clockPos += dt * clockRate * (1 + clockTrim);
                lastClockT = now;
                return clockPos;
            }

            function resumeClock() {
                if (clockRunning) return;
                if (!clockInit) return;          // 还没有权威进度，先别起跑
                lastClockT = nowSec();
                clockTrim = 0;
                clockRunning = true;
            }

            // 切歌：进度归零，等第一条权威进度再起跑
            function resetClock() {
                clockPos = 0;
                lastClockT = nowSec();
                clockTrim = 0;
                clockRunning = false;
                clockInit = false;
                targetProgress = 0;
                currentProgress = 0;
                resyncBgReveals(0);
                // 新歌的时长还没拿到，先清空进度条，等 /status 回来再填
                trackDuration = 0;
                shownSec = -1;
                shownDur = -1;
                updateProgressUI(0);
            }

            function freezeClock() {
                if (!clockRunning) return;
                clockProgress(nowSec());          // 先推进到此刻
                clockTrim = 0;
                clockRunning = false;
            }

            // 收到权威进度：把它折算成「速度微调」而不是位置偏移
            function syncClock(p, hard = false) {
                if (typeof p !== 'number' || !isFinite(p)) return;
                // 刚拖过进度条：播放器推来的旧进度会在新位置生效前先到一步，
                // 这段窗口内先别听它的，否则进度条会先被拽回去再弹回来
                if (!hard && performance.now() < seekPendingUntil) return;
                const now = nowSec();
                targetProgress = p;
                if (!clockInit) {
                    clockInit = true;
                    clockPos = p;
                    lastClockT = now;
                    clockTrim = 0;
                } else {
                    const pred = clockProgress(now);   // 先积分到此刻，再算误差
                    const err = p - pred;
                    if (hard || Math.abs(err) > CLOCK_HARD_ERR) {
                        // 拖动进度 / 切歌 / 长时间丢包：直接对齐
                        clockPos = p;
                        lastClockT = now;
                        clockTrim = 0;
                        if (hard) resyncBgReveals(p);
                    } else {
                        // 让 clockTrim 在 ~CLOCK_TRIM_TAU 内匀速吃掉误差：速度只变几个百分点，肉眼不可见
                        let t = clockTrim + err / (CLOCK_TRIM_TAU * clockRate);
                        if (t > CLOCK_TRIM_CAP) t = CLOCK_TRIM_CAP;
                        else if (t < -CLOCK_TRIM_CAP) t = -CLOCK_TRIM_CAP;
                        clockTrim = t;
                    }
                }
                // 关键：只要在播放，时钟就必须在走。
                // 否则进度只能靠事件"跳变"（实测会退化成 0.5 秒一跳），比不修还卡。
                if (playerStatus === 'playing') {
                    resumeClock();
                    if (!progressRunning) startProgressLoop();
                }
            }

            // ==================== 每帧循环（唯一权威） ====================
            function startProgressLoop() {
                if (progressRunning) return;
                progressRunning = true;
                lastClockT = nowSec();

                function frame() {
                    if (!progressRunning) return;
                    currentProgress = clockProgress(nowSec());
                    // 行切换、逐字扫光、逐字抬高、天际屏逐字出现全部由这里驱动
                    applyProgress(currentProgress);
                    progressRafId = requestAnimationFrame(frame);
                }
                progressRafId = requestAnimationFrame(frame);
            }

            // 根据进度刷新高亮 / 滚动 / 逐字效果（单一入口，避免多路数据互相拉扯）
            function applyProgress(progress) {
                // 进度条与时间文本也要跟着走；放在最前面，
                // 这样即使还没有歌词（纯音乐 / 歌词加载中）进度条也正常
                updateProgressUI(progress);
                if (!lyricLines.length) return;
                const idx = findActiveLineIndex(progress);
                if (idx !== currentActiveLineIndex) {
                    updateHighlight(idx, true);
                } else if (idx >= 0) {
                    updateActiveLine(idx, progress);
                }
                revealBgChars(progress);
            }

            function stopProgressLoop() {
                progressRunning = false;
                if (progressRafId) {
                    cancelAnimationFrame(progressRafId);
                    progressRafId = null;
                }
            }

            // ==================== 解析 ====================
            function parseLrcTag(tag) {
                const m = tag.match(/^(\d+):(\d+)(?:[.:](\d+))?$/);
                if (!m) return null;
                const min = parseInt(m[1], 10);
                const sec = parseInt(m[2], 10);
                const frac = m[3] ? parseFloat(`0.${m[3]}`) : 0;
                return min * 60 + sec + frac;
            }

            function isAnyListenFormat(text) {
                return /<\d+,\d+>/.test(text);
            }

            function parseAnyListenLrc(text) {
                const rawLines = text.split(/\r?\n/);
                const rawParsed = [];

                for (let raw of rawLines) {
                    raw = raw.trim();
                    if (!raw) continue;

                    const prefixMatch = raw.match(/^\[(\d+:\d+(?:[.:]\d+)?)\]/);
                    let linePrefixTime = null;
                    let content = raw;

                    if (prefixMatch) {
                        linePrefixTime = parseLrcTag(prefixMatch[1]);
                        content = raw.slice(prefixMatch[0].length);
                    }

                    const regex = /<(\d+),(\d+)>([^<]*)/g;
                    const chars = [];
                    let m;
                    while ((m = regex.exec(content)) !== null) {
                        const startMs = parseInt(m[1], 10);
                        const durationMs = parseInt(m[2], 10);
                        const char = m[3];
                        if (char && char.length > 0) {
                            chars.push({ startMs, durationMs, char });
                        }
                    }
                    if (chars.length === 0) continue;

                    rawParsed.push({
                        prefixTime: linePrefixTime,
                        chars,
                        text: chars.map(c => c.char).join('')
                    });
                }

                if (rawParsed.length === 0) return [];

                const allNoPrefix = rawParsed.every(l => l.prefixTime === null);
                const allFirstStartZero = rawParsed.every(l => l.chars[0].startMs < 100);
                const needAccumulate = allNoPrefix && allFirstStartZero && rawParsed.length > 1;

                const result = [];
                let accumTime = 0;

                for (let i = 0; i < rawParsed.length; i++) {
                    const line = rawParsed[i];
                    const baseTime = line.prefixTime !== null
                        ? line.prefixTime
                        : (needAccumulate ? accumTime : 0);

                    const chars = line.chars.map(c => {
                        const startSec = needAccumulate
                            ? baseTime + c.startMs / 1000
                            : (line.prefixTime !== null
                                ? line.prefixTime + c.startMs / 1000
                                : c.startMs / 1000);
                        const endSec = startSec + c.durationMs / 1000;
                        return { time: startSec, endTime: endSec, char: c.char };
                    });

                    chars.sort((a, b) => a.time - b.time);
                    const firstTime = chars[0].time;
                    const lastEnd = chars[chars.length - 1].endTime;

                    if (needAccumulate) {
                        accumTime = lastEnd;
                    }

                    result.push({
                        time: firstTime,
                        endTime: lastEnd,
                        text: line.text,
                        chars
                    });
                }

                for (let i = 0; i < result.length; i++) {
                    if (i + 1 < result.length) {
                        result[i].endTime = result[i + 1].time;
                    }
                }

                return result;
            }

            function parseStandardLrc(text) {
                const rawLines = text.split(/\r?\n/);
                const parsed = [];

                for (let raw of rawLines) {
                    raw = raw.trim();
                    if (!raw) continue;

                    const tagRegex = /\[(\d+:\d+(?:[.:]\d+)?)\]/g;
                    const tags = [];
                    let m;
                    while ((m = tagRegex.exec(raw)) !== null) {
                        const t = parseLrcTag(m[1]);
                        if (t !== null) {
                            tags.push({ time: t, index: m.index, fullLength: m[0].length });
                        }
                    }
                    if (tags.length === 0) continue;

                    if (tags.length >= 2) {
                        const chars = [];
                        for (let i = 0; i < tags.length; i++) {
                            const start = tags[i].index + tags[i].fullLength;
                            const end = (i + 1 < tags.length) ? tags[i + 1].index : raw.length;
                            const char = raw.slice(start, end).trim();
                            if (char) {
                                chars.push({ time: tags[i].time, endTime: null, char });
                            }
                        }
                        for (let i = 0; i < chars.length - 1; i++) {
                            chars[i].endTime = chars[i + 1].time;
                        }
                        if (chars.length > 1) {
                            const firstTime = chars[0].time;
                            const text = chars.map(c => c.char).join('');
                            parsed.push({ time: firstTime, text, chars });
                            continue;
                        }
                    }

                    const firstTime = tags[0].time;
                    const text = raw.replace(/\[\d+:\d+(?:[.:]\d+)?\]/g, '').trim();
                    if (!text) continue;
                    parsed.push({ time: firstTime, text, chars: null });
                }

                if (parsed.length === 0) return [];
                parsed.sort((a, b) => a.time - b.time);

                for (let i = 0; i < parsed.length; i++) {
                    const line = parsed[i];
                    if (i + 1 < parsed.length) {
                        line.endTime = parsed[i + 1].time;
                    } else {
                        if (line.chars && line.chars.length > 0) {
                            line.endTime = line.chars[line.chars.length - 1].time + 2;
                        } else {
                            line.endTime = line.time + 5;
                        }
                    }
                    if (line.chars && line.chars.length > 0) {
                        const lastChar = line.chars[line.chars.length - 1];
                        if (lastChar.endTime === null || lastChar.endTime === undefined) {
                            lastChar.endTime = line.endTime;
                        }
                    }
                }

                return parsed;
            }

            function parseLyric(text) {
                if (!text || typeof text !== 'string') return [];
                if (isAnyListenFormat(text)) {
                    const lines = parseAnyListenLrc(text);
                    if (lines.length > 0) {
                        console.log('[歌词] Any Listen 逐字格式，共', lines.length, '行');
                        return lines;
                    }
                }
                const lines = parseStandardLrc(text);
                console.log('[歌词] 标准 LRC 格式，共', lines.length, '行');
                return lines;
            }

            // ==================== 翻译歌词（tlyric） ====================
            // tlyric 是「翻译 LRC」，与主歌词共用同一时间轴，只是内容换成译文。
            // 这里只解析出 {time, text}（不需要逐字），交给 alignTransLyric 对齐。
            function parseTransLyric(text) {
                if (!text || typeof text !== 'string') return [];
                const rawLines = text.split(/\r?\n/);
                const parsed = [];
                for (let raw of rawLines) {
                    raw = raw.trim();
                    if (!raw) continue;
                    // 翻译行通常形如 [00:12.34]译文内容，也可能整行没有时间戳
                    const m = raw.match(/^\[(\d+:\d+(?:[.:]\d+)?)\](.*)$/);
                    if (!m) continue;
                    const t = parseLrcTag(m[1]);
                    const content = m[2].trim();
                    if (t === null || !content) continue;
                    parsed.push({ time: t, text: content });
                }
                if (!parsed.length) return [];
                parsed.sort((a, b) => a.time - b.time);
                return parsed;
            }

            // 把翻译行按「时间戳单调对齐」挂到主歌词行上。
            // tlyric 与主歌词共用同一时间轴，理想情况下第 k 条翻译对应第 k 句主歌词。
            // 但两边行数可能不一致（主歌词有前奏等待点、翻译偶尔缺行/多行），所以用
            // 严格单调双指针：主歌词行与翻译行都按 time 升序，翻译指针只前进不回退，
            // 每句主歌词匹配「时间戳最接近、且不早于上一条已匹配翻译」的那条；
            // 时间差超过 THRESHOLD 视为对不上（缺翻译），跳过，不强行错配。
            // 这样保证：① 译文顺序与主歌词顺序严格一致（不会错乱）；
            //          ② 不会把一条翻译重复挂到多句主歌词上。
            const TRANS_THRESHOLD = 2.5;   // 时间差阈值（秒），超过则视为无对应翻译

            function alignTransLyric(lines, transLines) {
                if (!lines.length || !transLines.length) return;
                let ti = 0;                              // 翻译指针，只前进不回退
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.isGap) continue;            // 等待点行没有翻译

                    // 把翻译指针推进到「时间戳最接近当前主行」的位置（单调，不回头）
                    // 内层只在 [ti, ...] 里找，且一旦翻译时间超过主行 + 阈值就停下
                    let best = -1, bestDiff = TRANS_THRESHOLD;
                    for (let j = ti; j < transLines.length; j++) {
                        const diff = Math.abs(transLines[j].time - line.time);
                        if (diff <= bestDiff) {
                            bestDiff = diff; best = j;
                        }
                        // 翻译时间戳已经越过主行太多，后面的只会更远，停止
                        if (transLines[j].time > line.time + TRANS_THRESHOLD) break;
                    }
